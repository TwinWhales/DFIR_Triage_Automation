# technique_unsupported 기각을 사람이 가른 기록.
#
# **이 파일이 있는 이유.** 기각 하나는 두 원인을 섞는다 — 모델이 기법을
# 잘못 붙였거나, 매핑이 좁거나. 기계가 가를 수 없다(`technique_supported`
# 의 설명). 그런데 가르지 않으면 같은 기각이 실행마다 다시 올라와 표를
# 채우고, 무엇을 이미 봤는지 알 수 없게 된다.
#
# `benchmark/collect.py --rejections` 가 여기를 읽어, 아직 안 본 기각만
# 남긴다. 판단이 곧 `corroborates:` 에 적을 값이다(`work.md` 10번).
#
# **원자료는 여기가 아니다.** 06단계가 실행마다
# `benchmark/results/rejections.jsonl` 에 덧붙인다(`stage06_verify/runlog.py`).
# 그쪽은 gitignore 대상이고 — 산출물이지 지식이 아니다 — 이 파일은 커밋된다.
#
# ## 적는 법
#
#   - technique: T1091
#     artifacts: [evtx:Sysmon]     # 기각 사유의 cited_artifacts 그대로, 정렬해서
#     verdict: model_wrong         # model_wrong | mapping_narrow
#     decided_on: "2026-09-04"
#     note: |
#       근거를 열어 보고 무엇이었는지 쓴다. 나중에 이 판단을 뒤집으려면
#       무엇을 봤는지가 있어야 한다.
#
# `verdict` 는 둘뿐이다.
#
#   model_wrong     모델이 기법을 잘못 붙였다. **매핑을 고치지 않는다.**
#                   기각이 옳았으므로 검사기를 건드리면 안 된다.
#   mapping_narrow  증거는 맞는데 매핑이 좁다. 그 기법의 `corroborates:` 에
#                   해당 아티팩트를 넣고, 여기 `note` 에 근거를 남긴다.
#
# **비어 있는 것과 판단이 없는 것은 다르다.** 판단하지 않은 기각은 여기
# 적지 않는다 — 적는 순간 "봤다"가 되어 표에서 사라진다.

#
# ## 이 대장이 못 하는 것
#
# **판단은 소견이 아니라 (기법, 인용 아티팩트) 조합에 붙는다.** 그래서
# 나중에 **정당한** T1091 ← evtx:Sysmon 소견이 나와도 "이미 가름"으로
# 묶여 표에서 사라진다. 조합이 같으면 구별할 방법이 없다.
#
# 소견 단위로 붙이면 이 문제는 없지만 대장이 실행마다 자라고, 같은 원인이
# 매번 새 항목으로 올라와 "무엇을 이미 봤나"를 다시 잃는다. 둘 중에서
# 조합 단위를 골랐다 — 매핑을 넓힐 때 적는 값이 정확히 그 조합이기 때문이다.
#
# **그래서 `note` 에 근거를 남기는 것이 규칙이다.** 나중에 같은 조합이
# 다른 이유로 올라왔다고 의심되면, 그 note 를 읽고 이 판단을 지우면 된다.

decided:
  - technique: T1091
    artifacts: [evtx:Sysmon]
    verdict: model_wrong
    decided_on: "2026-09-04"
    case: K-LIVE-0902-wide, K-LEDGER-0905
    note: |
      두 실행에서 같은 방식으로 틀렸다. 둘 다 정상 소프트웨어의 자기 관리
      동작을 USB 복제(T1091)로 읽었다.

      K-LIVE-0902-wide F3 — "cmd.exe 가 실행됐고 이는 VMware Tools 스크립트를
      실행한 T1091". 인용한 SYSMON#2130·#2134 는 Wazuh 에이전트의 자기 재시작
      이었다 (restart-wazuh.exe → cmd.exe /c net.exe stop|start Wazuh).

      K-LEDGER-0905 F2 — 같은 문장 꼴. 인용에 VMware Tools 의
      resume-vm-default.bat 실행 둘이 더 붙었다. **레코드는 제대로 읽고
      기법만 틀렸다** — 오배정 부류이고, 06 이 잡는 것이 맞다.

      둘 다 USB 와 무관하므로 기각이 옳다. 매핑을 넓히지 않는다.

      다만 이것이 T1091 에 evtx:Sysmon 이 필요 없다는 뜻은 아니다. USB 에서
      실행된 파일은 Sysmon EID 1 의 Image 가 이동식 드라이브를 가리키므로
      직접 증거에 가깝고, 그렇다면 corroborates 가 아니라 artifacts 에
      들어가야 한다. 실물로 확인한 뒤의 일이다(work.md 0번·10번).
