version: 1

# 기법과 무관하게 여는 상관분석 바탕.
#
# **왜 필요한가.** 03단계는 02단계가 고른 기법의 매핑만 읽는다. 그래서
# 기법 하나가 어긋나면 그 축의 아티팩트가 통째로 빠진다. 실측에서 그것이
# 프로세스 생성에서 일어났다 —
#
#   41개 매핑 중 13개가 evtx:Sysmon 을 아예 요청하지 않는다
#     T1091(USB) · T1200(하드웨어) · T1112(레지스트리) · T1197(BITS)
#     T1547.001(Run 키) · T1543.003(서비스) · T1053.005(스케줄) · …
#   T1041 · T1048(유출)은 [3, 22] 만 열어 EID 1 을 닫는다
#   T1021.002 는 [3] 만 연다
#
# 02가 `USB 삽입`을 T1091 로, `외부 접속`을 T1048 로 옮기면 — 실제로 그렇게
# 옮겼다 — cmd·certutil·powershell 의 실행 흔적이 04단계에서 한 건도 나오지
# 않는다. 보고서에는 그냥 "그런 실행이 없었다"로 보인다.
#
# **이것은 강제 선별(`--artifacts`)과 다르다.** 그쪽은 사람이 그 실행에서
# 지정하는 것이고, 이것은 어느 실행에나 걸리는 바탕이다.
#
# **여기에 아무거나 넣지 않는다.** 바탕은 "어느 침해 조사든 시간축을 맞추는
# 데 쓰는 것"만이다. $MFT 처럼 볼륨 전체를 뜨는 것을 넣으면 모든 실행이
# 비싸진다 — 그런 것은 기법이 요청할 때만 연다.
baseline:
  - name: evtx:Sysmon
    # 기법이 이미 Sysmon 을 요청했으면 **합친다**. 덮어쓰지 않는다 —
    # T1041 의 [3, 22] 는 그 기법에 맞는 판단이고, 우리는 거기에 1 을
    # 더할 뿐이다. 기법이 event_ids 를 안 적었으면 이미 채널 전체가
    # 열린 것이므로 손대지 않는다.
    # **3(네트워크 연결)은 2026-09-09 에 더했다.** 1 만 열면 "무엇이
    # 실행됐나"는 보이는데 **"누구에게 연결했나"가 통째로 없다.**
    #
    # 실측(`K-2LINE-KIOSK`): 두 줄짜리 질문("키오스크에 USB가 꽂힌 뒤
    # 포스기를 지나 관리서버까지…")에 02가 T1091·T1078.003 둘만 골랐고,
    # 그 매핑이 Sysmon 에 [1] 만 요청해 EID 3 이 한 건도 안 나왔다.
    # 같은 증거를 상세 프롬프트로 돌린 실행에는 EID 3 이 380건 있었고
    # 그중 60건이 옆 노드(POS)로 나간 연결이었다 — 횡적 이동의 유일한
    # 직접 증거이고, 08단계가 노드를 잇는 값도 거기서 나온다.
    #
    # 그 60건을 연 것은 T1041[3,22]·T1018[1,3] 이었는데, 두 기법은
    # 프롬프트가 "네트워크 스캔"·"횡적 이동"이라고 적어 줘서 02가 고른
    # 것이다. **입력이 답을 알려 줘야만 열리는 축은 바탕이 열어야 한다.**
    #
    # **싸다.** 그 실행에서 EID 3 은 380건이었다(EID 11 은 7,813건이라
    # 얘기가 다르다 — 그래서 11 은 넣지 않는다). 위 주석의 "$MFT 처럼
    # 볼륨 전체를 뜨는 것을 넣지 않는다"는 기준을 그대로 지킨다.
    event_ids: [1, 3]
    # 매핑이 (기법, 아티팩트) 쌍에 매긴 값보다 뒤다. 바탕은 조사의 초점이
    # 아니라 바탕이므로, 자리 배분에서 기법이 지목한 아티팩트를 밀어내면
    # 안 된다. 1 이 가장 앞이고 3 이 가장 뒤다.
    priority: 3
    rationale: 프로세스 생성·네트워크 연결 — 기법과 무관하게 여는 상관분석 바탕

  # **애플리케이션이 자기 인증을 적는 자리.** 윈도우 로그온(Security 4624)과
  # 다르다 — DB·서비스에 누가 붙었는지는 그 애플리케이션의 로그에만 있고,
  # 그것을 요청하는 기법 매핑이 있어도 02가 그 기법을 골라야 열린다.
  #
  # 실측(`K2L6`, 2026-09-10): 세 노드 모두 2줄짜리 질문에 02가 T1091·T1041
  # 둘만 골랐다. 아홉 번의 실행을 통틀어도 02가 낸 기법은 T1091 9회 ·
  # T1041 6회 · T1005 1회 · T1048 1회뿐이다. **DB 로그인을 요청하는
  # 기법(T1078 계열)을 02가 고른 적이 한 번도 없다.**
  #
  # 05단계 루프백이 이 채널을 요청할 수는 있었다(요청 가능 목록에 있다).
  # 그런데 세 노드가 실제로 요청한 것은 이미 선별된 T1041 과 시간 확장
  # 뿐이었다. **모델이 물어야만 열리는 축도 바탕이 열어야 한다** — 위
  # Sysmon EID 3 을 더한 것과 같은 판단이다.
  #
  # **안 쓰는 기계에서 공짜다.** 이 EID 들은 SQL Server 같은 애플리케이션이
  # 있어야 나온다:
  #
  #     MGMT   전체 6,269건 중 이 EID 426건
  #     KIOSK  0건
  #     POS    0건
  #
  # 채널 전체(6,269건)를 열지 않고 인증·감사만 좁힌 이유가 그것이다.
  # 나머지는 응용 프로그램 오류·시작 메시지라 침해 조사의 바탕이 아니다.
  - name: evtx:Application
    event_ids: [18453, 18454, 18456, 33205]
    priority: 3
    rationale: 애플리케이션 로그인 성공·실패와 감사 — 윈도우 로그온에는 없는 축

  # **윈도우가 자기 인증·지속성을 적는 자리.** 위 Application 이 "애플리케이션에
  # 누가 붙었나"라면 이쪽은 "이 단말에 누가 들어왔나"다.
  #
  # 실측(`Final-*`, 2026-09-10): 세 노드 모두 02가 T1091 하나만 골랐고,
  # 그 매핑이 Security 를 요청하지 않아 **원격 로그온(4624 Type 10)이 한 건도
  # 조사되지 않았다.** MGMT 는 그나마 Tier 2 로 유예됐는데 루프백이 그것을
  # 승격시키지 않아 결국 읽히지 않았다. 정답 시나리오에서 관리서버 진입은
  # RDP 였으므로, 침해의 축 하나가 통째로 "미조사"로 나갔다.
  #
  # **어느 침해 조사든 "누가 언제 들어왔나"는 시간축의 바탕이다.** Sysmon
  # EID 3 을 더한 것과 같은 판단이다 — 입력이 답을 알려 줘야만 열리는 축은
  # 바탕이 열어야 한다.
  #
  # **EID 를 고른 기준: `_flags.yaml` 이 실제로 거를 수 있는 것만.**
  # evtx:Security 의 signal_source 는 기본값(flags)이라, 붙을 flag 가 없는
  # EID 는 파싱만 되고 05단계에 한 건도 가지 않는다. 그런 것을 넣으면
  # 매니페스트의 레코드 수만 늘고 조사되는 것은 없다.
  # (그래서 6416(외부 장치 인식)은 **뺐다** — USB 축의 EID 지만 받을 flag 가
  # 없다. 넣으려면 `_flags.yaml` 에 flag 를 먼저 만들어야 한다.)
  #
  # 로그오프(4634·4647)도 뺐다. `session_state_changed` 가 거르긴 하지만
  # 대량이고 "누가 들어왔나"에 더하는 것이 없다.
  - name: evtx:Security
    event_ids: [1102, 4624, 4625, 4672, 4698, 4699, 4702,
                4720, 4728, 4732, 4738, 4778, 4779, 5140, 5145]
    priority: 3
    rationale: 인증·원격 로그온·예약 작업·계정 변경 — 누가 언제 들어와 무엇을 남겼나

  # **명령이 그대로 남는 유일한 자리.** Sysmon EID 1 은 프로세스의 명령행을
  # 주지만, 리버스 셸이나 `-EncodedCommand` 안에서 실제로 무엇이 실행됐는지는
  # 스크립트블록 로깅(4104)에만 남는다.
  #
  # **안 켜져 있으면 공짜다.** 스크립트블록 로깅은 기본 비활성이라 그런
  # 기계에서는 0건이고, 0건은 "그 범위에서 흔적이 확인되지 않았다"로
  # 보고서에 실린다 — 위 Application 과 같은 자리다.
  #
  # 켜져 있으면 4104 가 많을 수 있다. 그때도 바탕의 priority 는 3 이라
  # 기법이 지목한 아티팩트를 배분에서 밀어내지 않는다.
  - name: evtx:PowerShell
    event_ids: [4103, 4104]
    priority: 3
    rationale: 스크립트블록·모듈 로깅 — 난독화된 명령의 실제 내용이 남는 자리
