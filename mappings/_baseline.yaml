version: 1

# 기법과 무관하게 여는 상관분석 바탕.
#
# **왜 필요한가.** 03단계는 02단계가 고른 기법의 매핑만 읽는다. 그래서
# 기법 하나가 어긋나면 그 축의 아티팩트가 통째로 빠진다. 실측에서 그것이
# 프로세스 생성에서 일어났다 —
#
#   41개 매핑 중 13개가 evtx:Sysmon 을 아예 요청하지 않는다
#     T1091(USB) · T1200(하드웨어) · T1112(레지스트리) · T1197(BITS)
#     T1547.001(Run 키) · T1543.003(서비스) · T1053.005(스케줄) · …
#   T1041 · T1048(유출)은 [3, 22] 만 열어 EID 1 을 닫는다
#   T1021.002 는 [3] 만 연다
#
# 02가 `USB 삽입`을 T1091 로, `외부 접속`을 T1048 로 옮기면 — 실제로 그렇게
# 옮겼다 — cmd·certutil·powershell 의 실행 흔적이 04단계에서 한 건도 나오지
# 않는다. 보고서에는 그냥 "그런 실행이 없었다"로 보인다.
#
# **이것은 강제 선별(`--artifacts`)과 다르다.** 그쪽은 사람이 그 실행에서
# 지정하는 것이고, 이것은 어느 실행에나 걸리는 바탕이다.
#
# **여기에 아무거나 넣지 않는다.** 바탕은 "어느 침해 조사든 시간축을 맞추는
# 데 쓰는 것"만이다. $MFT 처럼 볼륨 전체를 뜨는 것을 넣으면 모든 실행이
# 비싸진다 — 그런 것은 기법이 요청할 때만 연다.
baseline:
  - name: evtx:Sysmon
    # 기법이 이미 Sysmon 을 요청했으면 **합친다**. 덮어쓰지 않는다 —
    # T1041 의 [3, 22] 는 그 기법에 맞는 판단이고, 우리는 거기에 1 을
    # 더할 뿐이다. 기법이 event_ids 를 안 적었으면 이미 채널 전체가
    # 열린 것이므로 손대지 않는다.
    event_ids: [1]
    # 매핑이 (기법, 아티팩트) 쌍에 매긴 값보다 뒤다. 바탕은 조사의 초점이
    # 아니라 바탕이므로, 자리 배분에서 기법이 지목한 아티팩트를 밀어내면
    # 안 된다. 1 이 가장 앞이고 3 이 가장 뒤다.
    priority: 3
    rationale: 프로세스 생성 — 기법과 무관하게 여는 상관분석 바탕
