# flags 어휘 정의 — 04단계 파싱이 룰 기반으로 부여한다.
#
# 이 어휘가 고정인 이유는 LLM에 전달할 레코드를 추리는 필터로 쓰이기
# 때문이다. 파서마다 다른 이름을 쓰면 record_filter.py가 레코드를
# 놓치고, 그 결과가 선별 재현율 저하로 잘못 집계된다.
#
# **이 파일이 어휘의 원본이다.** flagging.py 가 여기서 FLAGS 를 읽고,
# schemas/parsed_record.schema.json 의 enum 은 tools/sync_flag_enum.py 가
# 여기서 생성한다. 새 flag 는 이 파일에만 적고 생성기를 돌린 뒤 pytest 를
# 돌린다. 어긋나면 tests/test_mapping_loader.py 가 잡는다.
#
# ---------------------------------------------------------------- rule
#
# `when` 은 절(clause) 목록이고 **하나라도 맞으면** 붙는다. 절이 여럿인
# 것은 같은 뜻이 아티팩트마다 다르게 나타나기 때문이다 — deleted 를 보라.
#
#   artifact  대상. `evtx:*` 는 접두어 일치, `*` 하나면 전부.
#             카탈로그(_artifacts.yaml)에 있는 이름이어야 한다.
#   match     생략하면 "그 아티팩트의 모든 레코드". 나머지는 셋.
#               event_id       record["event_id"] 가 values 안에 있는가
#               list_contains  record[field] (리스트) 가 values 와 겹치는가
#               field_equals   record[field] 가 value 와 같은가
#
# `handler` 는 선언으로 표현되지 않는 판정이다. flagging.py 의 HANDLERS 에
# 등록된 이름만 쓸 수 있다. `when` 과 함께 쓰면 **둘 다** 만족해야 한다 —
# when 이 대상을 좁히고 handler 가 판정한다.
#
# **선언으로 되는 것을 handler 로 넘기지 않는다.** 그러면 이 파일만 읽어서는
# 무슨 조건인지 알 수 없게 되고, 그게 원래 문제였다. handler 는 타임스탬프
# 비교처럼 근거가 코드 주석에 붙어 있어야 하는 것만 쓴다.
#
# `condition` 은 사람이 읽는 요약이다. 실행되는 것은 `rule` 이다.

flags:
  timestamp_mismatch:
    artifacts: [$MFT]
    condition: $SI와 $FN 생성 시각 불일치
    note: 타임스탬프 조작(T1070.006)의 대표 흔적. $FN은 사용자 도구로 바꾸기 어렵다.
    rule:
      when:
        - artifact: $MFT
      # 방향과 대상 선택에 실측 근거가 붙어 있다. flagging.py 의
      # MISMATCH_PAIRS 주석 참조 — 세 쌍을 다 보면 오탐 59%였다.
      handler: si_earlier_than_fn

  deleted:
    artifacts: [$MFT, $UsnJrnl]
    condition: MFT 레코드 미할당 상태 / USN 사유에 file_delete
    note: |
      두 아티팩트가 같은 이름을 쓰는 이유는 뜻이 같기 때문이다. $MFT는
      "지금 지워져 있다"는 상태고 $UsnJrnl은 "지워졌다"는 사건이다.
      Tier 2 유예 조건이 이 플래그를 보므로 이름이 갈라지면 안 된다.
    rule:
      when:
        - artifact: $MFT
          match: field_equals
          field: allocated
          value: false
        - artifact: $UsnJrnl
          match: list_contains
          field: reason
          values: [file_delete]

  zero_timestamp:
    artifacts: [$MFT]
    condition: 타임스탬프가 0 또는 비정상 값
    note: |
      $UsnJrnl에는 붙이지 않는다. USN 파서는 시각을 읽지 못하면 timestamp
      키 자체를 빼므로 "0이 들어 있다"를 판정할 대상이 없다.
    rule:
      when:
        - artifact: $MFT
      handler: has_zero_timestamp

  file_created:
    artifacts: [$UsnJrnl]
    condition: USN 사유에 file_create
    note: |
      웹셸 설치(T1505.003)처럼 "없던 파일이 생겼다"가 핵심인 기법에서
      $MFT보다 강한 증거다. $MFT는 생성 시각만 남고 조작될 수 있는데,
      저널은 사건 자체를 순서대로 적는다.

      범위를 좁히지 않으면 많이 걸린다 — 바쁜 볼륨에서는 파일 생성이
      수만 건이다. 03단계가 extensions 로 좁혀 주는 것을 전제한다.
    rule:
      when:
        - artifact: $UsnJrnl
          match: list_contains
          field: reason
          values: [file_create]

  account_created:
    artifacts: [evtx:Security]
    condition: EVTX 4720
    rule:
      when:
        - artifact: evtx:*
          match: event_id
          values: [4720]

  privileged_group_add:
    artifacts: [evtx:Security]
    condition: EVTX 4728/4732, 대상이 특권 그룹
    note: |
      4728/4732에서 TargetUserName은 **그룹 이름**이다. 계정 이름이 아니다.
      이걸 헷갈리면 특권 그룹 추가를 전부 놓친다. 그 판정이 handler 에
      남아 있는 이유다 — 아래 privileged_groups 목록과 대조해야 한다.
    rule:
      when:
        - artifact: evtx:*
          match: event_id
          values: [4728, 4732]
      handler: target_is_privileged_group

  logon_success:
    artifacts: [evtx:Security]
    condition: EVTX 4624/4672
    note: |
      4672(특권 부여)는 관리자 세션이 열릴 때 4624 직후에 따라붙는
      동반 이벤트라 같은 이름으로 묶는다. 나누면 한 로그온이 두 어휘로
      갈라져 05단계에서 짝이 끊긴다.

      로그온은 정상 시스템에서도 많이 남는다. 이 flag 가 필터로 일하는
      것은 03단계가 event_ids 와 time_range 로 이미 좁혀 준 덕이다.
      범위 없이 evtx 전체에 붙이면 쿼터를 이것만으로 채운다.
    rule:
      when:
        - artifact: evtx:*
          match: event_id
          values: [4624, 4672]

  logon_failed:
    artifacts: [evtx:Security]
    condition: EVTX 4625
    note: 성공과 나누는 이유는 뜻이 다르기 때문이다. 실패의 연속은 자격증명 추측을, 실패 뒤의 성공은 그 성공을 뜻한다.
    rule:
      when:
        - artifact: evtx:*
          match: event_id
          values: [4625]

  service_config_changed:
    artifacts: [evtx:System]
    condition: EVTX 7040 서비스 시작 유형 변경
    note: |
      보안 서비스를 죽이는 흔한 방법이 삭제가 아니라 Start 값을
      4(disabled)로 바꾸는 것이다. 레지스트리에는 바뀐 결과만 남고
      바뀐 시점은 이 이벤트에만 남는다 — 그래서 7045(설치)와 따로 둔다.
    rule:
      when:
        - artifact: evtx:*
          match: event_id
          values: [7040]

  service_installed:
    artifacts: [evtx:System]
    condition: EVTX 7045
    note: T1543.003(서비스 지속성)의 대표 흔적. 설치 순간에만 남고 로그가 롤오버되면 사라진다.
    rule:
      when:
        - artifact: evtx:*
          match: event_id
          values: [7045]

  # ----------------------------------------------------------- 네트워크
  #
  # 아래 셋은 `evtx:*` 가 아니라 **정확한 아티팩트 이름**으로 건다.
  # EventID 는 제공자 안에서만 유일하기 때문이다(docs/limitations.md
  # "EventID만으로 이벤트를 특정하지 않습니다"). 실제로 겹친다 —
  # NetworkProfile 의 10000(네트워크 연결)은 T1200 매핑이 evtx:System 에
  # 요청하는 Kernel-PnP 10000 과 번호가 같다. `evtx:*` 로 걸면 장치 구성
  # 이벤트에 network_state_changed 가 붙는다.

  firewall_config_changed:
    artifacts: [evtx:Firewall]
    condition: 방화벽 규칙 추가·변경·삭제(2004/2005/2006/2033) 또는 프로필 설정 변경(2003)
    note: |
      규칙 추가와 프로필 끄기를 한 어휘로 묶는다. 조사에서 묻는 것이
      "방화벽 구성이 사건 시각에 손댔는가" 하나이고, 어느 쪽이었는지는
      fields 의 RuleName·Direction·Action 을 보면 나온다.

      2033(모든 규칙 삭제)은 드물지만 강한 신호라 같이 넣는다.
    rule:
      when:
        - artifact: evtx:Firewall
          match: event_id
          values: [2003, 2004, 2005, 2006, 2033]

  bits_transfer:
    artifacts: [evtx:BITS]
    condition: BITS 전송 작업 생성·시작·중지·오류 (3/59/60/61)
    note: |
      BITS 는 Windows Update 가 늘 쓰는 정상 기능이라 그 자체로는
      의심 신호가 아니다. 값이 있는 것은 **59/60 이 URL 을 들고 있다**는
      점이다 — 어디로 갔는지가 fields 에 남는 몇 안 되는 자리다.

      3(작업 생성)은 소유자와 생성 프로세스를 담는다. 정상 트래픽과
      가르는 것은 이 flag 가 아니라 그 필드를 읽는 05단계의 몫이다.
    rule:
      when:
        - artifact: evtx:BITS
          match: event_id
          values: [3, 59, 60, 61]

  network_state_changed:
    artifacts: [evtx:NetworkProfile]
    condition: 네트워크 연결(10000)·해제(10001)
    note: |
      단독으로는 약한 신호다. 쓰임은 다른 흔적의 시각을 가르는 데 있다 —
      "그때 네트워크에 붙어 있었는가"가 외부 전송 가능성의 전제다.
    rule:
      when:
        - artifact: evtx:NetworkProfile
          match: event_id
          values: [10000, 10001]

  # ── K-001 키오스크 시나리오 (2026-08-25) ───────────────────────────
  #
  # 아래 일곱은 새로 연 채널들의 게이트 4를 닫는다. 채널만 등록하고 여기를
  # 빠뜨리면 03단계가 "봤다"고 적고 04단계가 파싱까지 한 뒤 **모델에만 한
  # 건도 안 간다** — 보고서에는 그냥 소견이 없는 걸로 보인다.

  shell_spawned:
    artifacts: [evtx:Sysmon]
    condition: Sysmon 1(프로세스 생성) 중 셸·시스템 유틸리티가 실행된 것
    note: |
      K-001 Stage 3의 결정적 신호다. 주문 UI만 떠 있어야 하는 키오스크에서
      셸이 뜨는 것 자체가 제한 환경 이탈이고, 부모가 무엇이냐가 그 다음
      질문이다(fields.ParentImage 는 레코드에 그대로 실려 모델이 본다).

      **EID 1 전체에 붙이지 않는다.** 프로세스 생성은 이 장비에서 가장 흔한
      이벤트라 전량에 붙이면 필터가 일을 안 한다. 목록은 "정상 키오스크
      운영에서 뜰 이유가 없는 것"만 담는다.

      앞의 역슬래시는 경로 구분자다. 빼면 evilcmd.exe 가 함께 걸린다.

      목록은 공개 DFIR 자료와 Stage 3 서술(cmd/explorer/taskmgr)에서 골랐고
      **실제 키오스크 이미지로 대조한 적이 없다** — docs/limitations.md.
    rule:
      when:
        - artifact: evtx:Sysmon
          match: field_endswith
          field: fields.Image
          values:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\explorer.exe'
            - '\taskmgr.exe'
            - '\mmc.exe'
            - '\regedit.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\rundll32.exe'
            - '\control.exe'

  network_connection:
    artifacts: [evtx:Sysmon]
    condition: Sysmon 3(네트워크 연결)
    note: |
      Stage 4b·7의 근거. 단독으로는 약한 신호이고, 값은 "어느 프로세스가
      어디로 붙었는가"를 다른 단계의 프로세스와 맞춰 보는 데 있다.

      network_state_changed(NetworkProfile 10000/10001)와 이름을 나눈 것은
      뜻이 다르기 때문이다. 저쪽은 "네트워크에 붙어 있었는가"이고 이쪽은
      "이 프로세스가 통신했는가"다.
    rule:
      when:
        - artifact: evtx:Sysmon
          match: event_id
          values: [3]

  device_connected:
    artifacts: [evtx:DriverFrameworks, evtx:KernelPnP]
    condition: 외부 장치 연결·설치 이벤트
    note: |
      Stage 1. 채널 둘이 같은 사실을 다르게 남긴다 — DriverFrameworks 는
      연결/해제 시각을, Kernel-PnP 는 장치 설치를 남긴다. 어느 쪽이 남을지가
      장치와 드라이버 상태에 따라 달라서 둘 다 본다.

      **이벤트 ID는 공개 자료 기준 추정치다.** 실제 증거로 대조하지 않았다 —
      docs/limitations.md "매핑 — 검증되지 않은 채 채운 항목".
    rule:
      when:
        - artifact: evtx:DriverFrameworks
          match: event_id
          values: [2003, 2004, 2005, 2006, 2010, 2100, 2101, 2102, 2105, 2106]
        - artifact: evtx:KernelPnP
          match: event_id
          values: [400, 410, 411, 420, 430]

  kiosk_restriction_event:
    artifacts: [evtx:AssignedAccess, evtx:AssignedAccessAdmin, evtx:AssignedAccessBroker]
    condition: Assigned Access 채널에 남은 모든 이벤트
    note: |
      Stage 3. **event_id 로 좁히지 않는다.** 세 채널 다 로그가 작고, 여기
      남는 것 자체가 키오스크 구성·세션·이탈 시도와 관련된 사건이다. 좁히려면
      어느 ID가 무엇인지 알아야 하는데 그것을 실물로 확인하지 못했다.

      전 레코드에 붙는 플래그는 필터 역할을 못 한다는 원칙의 예외다. 근거는
      "로그가 작다"이고, 그 전제가 깨지면(키오스크가 이 채널을 수만 건 남기면)
      다시 좁혀야 한다.
    rule:
      when:
        - artifact: evtx:AssignedAccess
        - artifact: evtx:AssignedAccessAdmin
        - artifact: evtx:AssignedAccessBroker

  remote_session:
    artifacts: [evtx:RDPConnection, evtx:RDPSession]
    condition: 원격 연결 인증(1149)·세션 로그온/셸 시작/재연결(21·22·24·25)
    note: |
      Stage 4b. Security 4624 Type 10 과 같은 사건을 다른 각도에서 남긴다 —
      저쪽은 "누가 로그온했는가"이고 이쪽은 "어느 세션이 언제 열렸는가"다.
      둘을 맞춰 보면 원격 접속의 출처와 지속 시간이 갈린다.
    rule:
      when:
        - artifact: evtx:RDPConnection
          match: event_id
          values: [1149]
        - artifact: evtx:RDPSession
          match: event_id
          values: [21, 22, 23, 24, 25, 39, 40]

  app_crash:
    artifacts: [evtx:Application]
    condition: 애플리케이션 오류(1000)·WER 보고(1001)·행(1002)
    note: |
      Stage 3 보조. 키오스크 앱이 비정상 종료하면 그 아래 셸이 드러나는
      경우가 있어, 이탈 시점의 정황 증거가 된다.

      **Application 로그는 크다**(실측 8,257건). event_id 로 좁히지 않으면
      필터가 일을 안 한다.
    rule:
      when:
        - artifact: evtx:Application
          match: event_id
          values: [1000, 1001, 1002]

  timestamp_truncated:
    artifacts: [$MFT]
    condition: $SI 타임스탬프의 100ns 자리가 전부 0
    note: |
      K-001 Stage 5의 두 번째 탐지 포인트. timestamp_mismatch 가 못 잡는
      경우를 겨냥한다 — $SI 와 $FN 을 함께 조작하면 방향 비교가 통과하는데,
      그때도 서브초는 대개 0으로 남는다.

      "존재하는 $SI 시각이 둘 이상이고 그것이 전부 서브초 0"이 조건이다.
      하나만 보면 우연히 걸리는 것이 반드시 나온다. 근거와 실측 오탐률은
      flagging.py 의 si_subsecond_zeroed docstring 에 있다.
    rule:
      when:
        - artifact: $MFT
      handler: si_subsecond_zeroed

  outside_time_range:
    artifacts: [$MFT, $UsnJrnl, evtx:Security, evtx:System, evtx:Firewall,
                evtx:BITS, evtx:NetworkProfile, evtx:Sysmon, evtx:DriverFrameworks,
                evtx:KernelPnP, evtx:AssignedAccess, evtx:AssignedAccessAdmin,
                evtx:AssignedAccessBroker, evtx:RDPConnection, evtx:RDPSession,
                evtx:Application, prefetch, recentfilecache]
    condition: 선별된 시간 범위 밖
    note: |
      범위 밖이라도 버리지 않고 표시만 한다. 시간 범위 추론이 틀렸을 때
      원인을 되짚으려면 레코드가 남아 있어야 한다.

      scope 를 알아야 판정되므로 handler 다. 03단계 산출물이 없으면
      (scope=None) 절대 붙지 않는다.
    rule:
      when:
        - artifact: "*"
      handler: outside_selected_time_range

# 특권 그룹 판정 기준. privileged_group_add 의 handler 가 참조한다.
# 이쪽은 예전부터 런타임에 읽던 값이라 이름만 추가하면 바로 반영된다.
privileged_groups:
  - Administrators
  - Domain Admins
  - Enterprise Admins
  - Backup Operators
  - Remote Desktop Users
