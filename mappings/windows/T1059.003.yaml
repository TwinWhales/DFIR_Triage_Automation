technique: T1059.003
name: "Command and Scripting Interpreter: Windows Command Shell"
os: windows

# K-001 Stage 2 — HID(BadUSB)가 Win+R로 실행창을 열어 cmd를 획득.
#
# **정직한 매핑 주의:** "키오스크 이탈" 자체는 ATT&CK 단일 기법에 정확히
# 대응되지 않는다. 셸 획득이라는 관측 가능한 행위로 근사 매핑한 것이며,
# 그 한계를 여기 적어 둔다.
#
# 결정적 근거는 **무인 키오스크에 셸이 존재한다는 사실 자체**다. HID 시나리오
# 에서 부모는 explorer.exe(Win+R 실행창)이며, 주문 앱이 부모인 경우와
# 구별된다. 어느 쪽이든 정상 운영에서 키오스크에 cmd가 나타나는 것은
# 없다 — shell_spawned 플래그가 그 레코드를 05단계까지 올린다.

artifacts:
  - name: evtx:Sysmon
    tier: 1
    priority: 1
    scope_template:
      event_ids: [1]
    rationale: 셸 프로세스의 생성 시각과 부모 프로세스(explorer.exe — Win+R 경유) — 키오스크에 cmd 등장 자체가 이상

  - name: evtx:AssignedAccess
    tier: 1
    priority: 2
    scope_template: {}
    rationale: 키오스크 제한 환경의 동작과 이탈 시도

  - name: evtx:AssignedAccessBroker
    tier: 1
    priority: 2
    scope_template: {}
    rationale: 키오스크 세션의 생성·종료 시각

  - name: evtx:AssignedAccessAdmin
    tier: 1
    priority: 2
    scope_template: {}
    rationale: 키오스크 구성 적용 실패·오류

  # 키오스크 앱이 죽으면 그 아래 셸이 드러나는 경우가 있다. 이탈 시점의
  # 정황이지 그 자체가 이탈의 증거는 아니라 priority 3 이다.
  - name: evtx:Application
    tier: 1
    priority: 3
    scope_template:
      event_ids: [1000, 1001, 1002]
    rationale: 키오스크 앱의 비정상 종료 시각

  - name: prefetch
    tier: 2
    priority: 2
    trigger: Tier1에서 셸 프로세스 생성이 확인되어 실행 이력을 확인해야 하는 경우
    rationale: 셸·시스템 유틸리티의 실행 횟수와 최근 실행 시각