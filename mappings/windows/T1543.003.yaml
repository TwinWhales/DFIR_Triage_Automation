technique: T1543.003
name: "Create or Modify System Process: Windows Service"
os: windows

artifacts:
  - name: evtx:System
    tier: 1
    scope_template:
      # 7045 서비스 설치 / 7034 비정상 종료 / 7036 상태 변경
      event_ids: [7045, 7034, 7036]
    rationale: 서비스 설치 및 상태 변경

  # 7045는 설치 순간에만 남고 로그가 롤오버되면 사라진다. 레지스트리에는
  # 현재 등록 상태가 그대로 있으므로 Tier 1로 둔다 — 이벤트 로그의 보조가
  # 아니라 같은 층위의 1차 증거다.
  #
  # CurrentControlSet 은 하이브에 없는 이름이지만 그대로 쓴다. 파서가
  # Select\Current 를 읽어 ControlSet00N 으로 바꾼다.
  - name: registry:SYSTEM
    tier: 1
    scope_template:
      path_prefix: ['SYSTEM\CurrentControlSet\Services']
    rationale: 서비스 등록 정보 (ImagePath·Start·ObjectName)

  - name: $MFT
    tier: 2
    trigger: Tier1에서 서비스 바이너리 경로가 확인된 경우
    rationale: 서비스 바이너리 생성 시각 및 타임스탬프 조작 여부

  # 레지스트리는 "등록됐다"까지만 말한다. ImagePath 가 있어도 그 바이너리가
  # 실제로 돌았는지는 다른 문제다. 프리패치가 그 자리를 메운다.
  - name: prefetch
    tier: 2
    trigger: Tier1에서 서비스 바이너리 경로가 확인된 경우
    rationale: 등록된 서비스 바이너리가 실제로 실행됐는지
