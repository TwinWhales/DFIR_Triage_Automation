technique: T1657
name: "Financial Theft"
os: windows

# K-001 Stage 6 — 영향 관점의 기법.
#
# **이 기법의 1차 근거는 이 도구 밖에 있다.** 비정상 거래 자체는 POS 앱
# 로그와 거래 DB 에 남고, 둘 다 팀이 만드는 애플리케이션의 산출물이라
# 카탈로그에 없다(담당 6 영역).
#
# 여기서 하는 일은 **그 시각에 무슨 일이 있었는가**를 OS 쪽에서 대는
# 것뿐이다. 매핑을 비워 두지 않는 이유는, 비워 두면 03단계가 이 기법을
# "매핑 없음"으로 남기고 보고서가 그 단계를 통째로 언급하지 않기 때문이다.
artifacts:
  - name: $MFT
    tier: 1
    priority: 2
    scope_template:
      path_prefix: ['{pos_db_root}']
    rationale: 거래 DB 파일이 변경된 시각

  - name: evtx:Sysmon
    tier: 1
    priority: 2
    scope_template:
      event_ids: [1]
    rationale: 거래 시각 전후에 실행된 프로세스

  - name: evtx:Security
    tier: 2
    trigger: Tier1에서 비정상 거래 시각이 특정되어 그 시각의 로그온 주체를 가려야 하는 경우
    rationale: 거래 시각의 로그온 세션과 계정

defaults:
  # **아직 정해지지 않은 값이다.** K-001 의 Mock POS 앱이 개발되지 않아
  # 거래 데이터가 어디 놓일지 모른다(설계서 §9 D1 의 열린 결정). 관례적인
  # 자리를 임시로 넣어 둔 것이고, 랩이 구축되면 실제 경로로 바꿔야 한다.
  #
  # {pos_db_root} 는 시나리오 entities 에서 채워지는 다섯 변수에 없으므로
  # **항상 이 기본값이 쓰인다.** 틀리면 이 기법의 Tier 1 $MFT 요청이
  # 0건을 내는데, 경로를 잘못 짚은 것인지 흔적이 없는 것인지 산출물만
  # 보고는 구별되지 않는다 — docs/limitations.md.
  pos_db_root: 'C:\ProgramData\POS'
