technique: T1565.001
name: "Data Manipulation: Stored Data Manipulation"
os: windows

# K-001 Stage 5·6 — 거래 DB 조작.
#
# **DB 내용은 이 도구가 못 본다.** SQLite 파일을 열어 레코드를 비교하는
# 것은 담당 6의 영역이고, 여기서 하는 일은 "그 파일이 언제 손을 탔는가"
# 까지다. 그 한계는 보고서의 분석 범위에 그대로 남는다.
#
# **2026-09-02 — SQLite 파서가 생겼다.** 아래 pos_db_root 가 정해지고
# 그 상태의 이미지가 생기면, mappings/_artifacts.yaml 한 줄과
# parsers/sqlite.py 의 PROFILES 몇 줄로 거래 DB 를 붙일 수 있다. 그때
# 볼 것(WITHOUT ROWID 여부·시각 컬럼 인코딩)은 work.md 2-3 에 있다.
#
# 위의 분담선은 이렇게 다시 그었다 — 레코드를 오프셋과 함께 뽑아 05단계에
# 태우는 데까지가 이쪽이고, 거래 데이터 자체의 대사·비교는 담당 6이다.
artifacts:
  - name: $MFT
    tier: 1
    priority: 1
    scope_template:
      path_prefix: ['{pos_db_root}']
      extensions: ['.db', '.sqlite', '.sqlite3', '.db-wal', '.db-journal', '.db-shm']
    rationale: 거래 DB와 WAL/journal 파일의 수정 시각

  - name: evtx:Sysmon
    tier: 1
    priority: 2
    scope_template:
      event_ids: [1, 11]
    rationale: DB 파일을 만진 프로세스

  - name: $UsnJrnl
    tier: 2
    priority: 2
    trigger: Tier1 $MFT에서 거래 DB 파일의 timestamp_mismatch 또는 deleted 플래그 발견 시
    rationale: DB 파일의 변경·삭제 이력

defaults:
  # **아직 정해지지 않은 값이다.** K-001 의 Mock POS 앱이 개발되지 않아
  # 거래 DB 가 어디 놓일지 모른다(설계서 §9 D1 의 열린 결정). 관례적인
  # 자리를 임시로 넣어 둔 것이고, 랩이 구축되면 실제 경로로 바꿔야 한다.
  #
  # {pos_db_root} 는 시나리오 entities 에서 채워지는 다섯 변수에 없으므로
  # **항상 이 기본값이 쓰인다.** 틀리면 이 기법의 Tier 1 $MFT 요청이
  # 0건을 내는데, 경로를 잘못 짚은 것인지 흔적이 없는 것인지 산출물만
  # 보고는 구별되지 않는다 — docs/limitations.md.
  pos_db_root: 'C:\ProgramData\POS'
