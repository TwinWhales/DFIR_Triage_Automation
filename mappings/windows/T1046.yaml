technique: T1046
name: "Network Service Discovery"
os: windows

# K-001 Stage 2 — 키오스크에서 POS 의 445/3389/1433 을 훑어 SMB 취약 여부를
# 확인한 자리. T1018 과 나뉘는 것은 **무엇을 세느냐**다 — 저쪽은 "어느
# 호스트가 있나"(ping), 이쪽은 "그 호스트의 어느 서비스가 열려 있나"다.
#
# 실측(`K2L3-KIOSK`, 2026-09-10)에서 이 기법이 없어 nmap 포트 스캔이
# T1059.003(명령 셸)으로 붙었다. 관측은 옳았고 이름만 없었다:
#
#   SYSMON#22453  "C:\Temp\nmap\Nmap\nmap.exe" -Pn -T4 -p 445,3389,1433,135,139 100.70.51.80
#   SYSMON#22457  "C:\Temp\nmap\Nmap\nmap.exe" -Pn -sV 100.70.51.80
artifacts:
  - name: evtx:Sysmon
    tier: 1
    priority: 1
    scope_template:
      event_ids: [1, 3]
    rationale: 스캐너 실행과 명령행(대상·포트 목록)이 EID1, 그 결과로 나간 연결 다발이 EID3

  # 스캐너는 대개 도구를 들여와서 돈다. 실행 이력이 남으면 언제 몇 번
  # 돌았는지가 명령행 없이도 잡힌다.
  - name: prefetch
    tier: 2
    priority: 2
    trigger: Tier1에서 스캐너 실행이 확인되어 실행 횟수·최근 실행 시각을 확인해야 하는 경우
    rationale: 스캐너 실행 횟수와 최근 실행 시각

  # 스캔은 짧은 시간에 많은 연결을 낸다. Sysmon 이 없는 호스트에서는
  # 그 규모가 SRUM 에만 남는다(T1048 이 같은 이유로 이 채널을 든다).
  - name: srum:NetworkConnectivity
    tier: 2
    priority: 3
    trigger: Sysmon EID3 이 없어 연결 다발을 확인하지 못한 경우
    rationale: 앱별 네트워크 연결 이력 — 스캔의 규모
