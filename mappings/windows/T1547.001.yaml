technique: T1547.001
name: "Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder"
os: windows

artifacts:
  # HKLM\...\Run·RunOnce만 커버한다. HKCU 쪽(사용자별 자동실행)은
  # NTUSER.DAT 하이브가 필요한데 지금 카탈로그는 SYSTEM·SOFTWARE 두
  # 볼륨 하이브만 지원한다(사용자별 하이브 다중 매칭은 work.md 트랙 A
  # 참고). 키오스크처럼 단일 로컬 계정으로 상시 로그인된 환경에서는
  # HKLM 쪽 비중이 커서 우선 이것만으로 채운다 — docs/limitations.md 참고.
  - name: registry:SOFTWARE
    tier: 1
    scope_template:
      path_prefix:
        - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
        - 'SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce'
    rationale: 시스템 전역 자동실행 등록 키(HKLM Run/RunOnce)

  - name: registry:SYSTEM
    tier: 2
    trigger: Tier1에서 서비스로 위장한 자동실행 항목이 의심되는 경우
    rationale: 서비스 기반 지속성(T1543.003)과의 교차 확인

  - name: $MFT
    tier: 2
    trigger: Tier1에서 자동실행 등록 대상의 실행 파일 경로가 확인된 경우
    rationale: 등록된 실행 파일의 생성 시각 및 타임스탬프 조작 여부

  # 아직 실제 Amcache.hve로 대조하지 않은 채 채운 것이다 —
  # docs/limitations.md 참고. 등록만 됐고 실행되지 않은 자동실행
  # 항목과 실제로 실행된 항목을 가르는 것이 목적이다.
  - name: registry:Amcache
    tier: 2
    trigger: Tier1에서 자동실행 등록 대상의 실행 파일 경로가 확인된 경우
    rationale: 등록된 자동실행 대상이 실제로 실행된 적 있는지 확인

  # 위와 **같은 질문에 대한 Windows 7 쪽 답이다.** Amcache.hve는 Win8
  # 부터라 Win7 이미지에는 없고, 그 자리에 이것이 있다.
  #
  # 둘을 다 요청하는 이유는 03단계가 증거를 열지 않아 버전을 모르기
  # 때문이다. 해당 없는 쪽은 04단계가 빌드 번호를 보고
  # version_not_applicable 로 뺀다(src/stage04_parse/osinfo.py). 여기서
  # 한쪽만 고르면 그 버전의 이미지에서 증거를 통째로 놓친다.
  - name: recentfilecache
    tier: 2
    trigger: Tier1에서 자동실행 등록 대상의 실행 파일 경로가 확인된 경우
    rationale: 등록된 자동실행 대상이 실제로 실행된 적 있는지 확인 (Windows 7)
