technique: T1490
name: "Inhibit System Recovery"
os: windows

# 되돌릴 길을 먼저 끊는다. 섀도 복사본을 지우고, 복구 환경을 끄고, 백업
# 카탈로그를 지운다. **암호화(T1486)보다 먼저 오는 것이 보통**이라, 이쪽이
# 먼저 보이면 아직 막을 시간이 있다는 뜻이다.
#
# 이 기법은 거의 전부 명령행으로 일어난다 — vssadmin · wbadmin · bcdedit ·
# WMI 의 shadowcopy 삭제. 지워진 뒤에는 "없다"는 사실만 남아 무엇이 지웠는지
# 알 수 없으므로, 명령행이 유일한 직접 증거다.
#
# 실측(K2L5 세 노드, 2026-09-10): 해당 명령행 **0건**. 위 T1486 과 같은
# 성격이고, 실물로 대조한 적이 없다.
artifacts:
  - name: evtx:Sysmon
    tier: 1
    priority: 1
    scope_template:
      event_ids: [1]
    rationale: vssadmin·wbadmin·bcdedit 등 복구 수단을 지우거나 끄는 명령행 — 무엇이 지웠는지는 여기에만 있다

  # 섀도 복사본 서비스를 서비스 수준에서 끈 경우. 명령행 대신 서비스 구성이
  # 바뀐다.
  - name: evtx:System
    tier: 1
    priority: 2
    scope_template:
      event_ids: [7040]
    rationale: 볼륨 섀도 복사본 서비스의 시작 유형 변경 시점

  - name: $MFT
    tier: 2
    priority: 3
    trigger: Tier1에서 복구 수단 삭제가 확인되어 백업 파일의 상태를 확인해야 하는 경우
    rationale: 백업·복구 관련 파일이 남아 있는지
