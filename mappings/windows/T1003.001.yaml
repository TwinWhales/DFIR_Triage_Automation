technique: T1003.001
name: "OS Credential Dumping: LSASS Memory"
os: windows

# 자격증명을 메모리에서 긁는다. K-001 시나리오는 설정 파일의 평문을 쓰지만
# (T1552.001), 그것이 없는 환경에서 다음으로 가는 자리가 여기다.
#
# **정석 신호인 Sysmon EID 10(ProcessAccess)을 못 쓴다.** lsass 를 누가 어떤
# 권한으로 열었는지가 거기 있는데, 04단계에 그 EID 를 받는 flag 가 없다
# (`_flags.yaml` 이 받는 Sysmon EID 는 1·3·5·11·22 뿐이다). 받을 것이 없는
# EID 를 요청하면 레코드가 "볼 이유 없이" 05에 실리고,
# `test_every_mapped_event_id_has_a_flag_that_receives_it` 가 그것을 막는다.
# 그래서 **덤프하는 쪽**(도구 실행과 산출 파일)으로 우회한다.
#
# 실측(K2L5 세 노드, 2026-09-10): 덤프 도구의 실행은 **0건**이다. lsass 를
# 문자열로 담은 레코드 23건은 전부 `lsass.exe` 자신의 실행이었다. 이 매핑은
# 이 사건이 아니라 다음 사건을 위한 것이고, 그 사실을 여기 적어 둔다.
artifacts:
  - name: evtx:Sysmon
    tier: 1
    priority: 1
    scope_template:
      event_ids: [1, 11]
    rationale: 덤프 도구의 실행과 명령행(대상 프로세스·출력 경로)이 EID1, 덤프 파일 생성이 EID11

  - name: $MFT
    tier: 2
    priority: 2
    trigger: Tier1에서 덤프 도구 실행이 확인되어 산출 파일을 특정해야 하는 경우
    rationale: 덤프 파일의 생성 시각과 크기

  - name: $UsnJrnl
    tier: 2
    priority: 3
    trigger: Tier1에서 덤프가 확인되었고 그 파일이 지워졌을 수 있는 경우
    rationale: 덤프한 뒤 지운 이력
