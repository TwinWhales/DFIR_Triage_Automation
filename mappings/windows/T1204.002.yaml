technique: T1204.002
name: "User Execution: Malicious File"
os: windows

# K-001 Stage 2 — USB 안의 비승인 실행파일이 실행된다.
#
# 실행 흔적은 한 아티팩트가 다 말해 주지 않는다. 프리패치는 "몇 번 언제",
# Amcache 는 "어느 파일이 어떤 해시로", $MFT 는 "언제 디스크에 놓였는가"를
# 따로 남긴다. 셋을 겹쳐야 "USB 연결 직후 새 실행파일이 실행됐다"가 선다.
artifacts:
  - name: prefetch
    tier: 1
    priority: 1
    scope_template: {}
    rationale: 실행 파일의 실행 횟수·최근 실행 시각·적재된 파일 목록

  # Windows 8 이상. Win7 이미지에서는 04단계가 버전 미해당으로 뺀다.
  - name: registry:Amcache
    tier: 1
    priority: 1
    scope_template:
      path_prefix:
        - 'Amcache\Root\InventoryApplicationFile'
        - 'Amcache\Root\File'
    rationale: 실행 파일의 전체 경로·SHA1·최초 등장 시각

  # Windows 7. Amcache 와 배타적이며 둘 다 요청하는 이유는 03단계가
  # 증거의 Windows 버전을 모르기 때문이다(src/stage04_parse/osinfo.py).
  - name: recentfilecache
    tier: 1
    priority: 1
    scope_template: {}
    rationale: 최근 처음 실행된 실행 파일의 전체 경로 (Windows 7)

  - name: evtx:Sysmon
    tier: 1
    priority: 1
    scope_template:
      # Event 5 is required to close the lifetime of Event 1 processes.  It is
      # context for the sLLM, not a maliciousness rule.
      event_ids: [1, 5]
    rationale: 프로세스 생성 시각·명령행·부모 프로세스·해시

  - name: $MFT
    tier: 1
    priority: 2
    scope_template:
      extensions: ['.exe', '.dll', '.scr', '.com', '.bat', '.cmd', '.ps1', '.vbs', '.js']
    rationale: 드롭된 실행 파일의 생성 시각

  - name: $UsnJrnl
    tier: 2
    priority: 2
    trigger: Tier1에서 악성 실행 파일의 생성·삭제·이동 이력을 추가로 확인해야 하는 경우
    rationale: 실행 파일의 생성·삭제·이동 이력
  # ── UWP 앱의 실행·설치 흔적 (2026-09-02) ─────────────────────────────
  #
  # **프리패치와 Amcache 가 UWP 앱을 잘 말해 주지 않는다.** 위 다섯은
  # 전부 Win32 실행 파일을 겨냥한 자리이고, 키오스크에서 Assigned Access
  # 가 지정하는 것은 UWP 앱이다. 그 축을 이 둘이 메운다.
  #
  # 매핑 자리는 잠정이다 — 키오스크 기법 목록이 확정되면 다시 본다
  # (docs/limitations.md 2-7). 지금 여기 둔 이유는 "무엇이 실행됐나"를 묻는 기법이
  # 이것 하나뿐이기 때문이다.
  - name: sqlite:StateRepository
    tier: 2
    priority: 3
    trigger: Tier1 에서 UWP 앱(패키지)이 관련된 정황이 보이거나, 프리패치·Amcache 에 실행 흔적이 없는 경우
    scope_template: {}
    rationale: UWP 패키지의 설치 시각·설치 위치·실행 파일 (PackageUser.InstallTime)

  - name: sqlite:Notifications
    tier: 2
    priority: 3
    trigger: Tier1 에서 실행 시각을 좁히지 못했고, 해당 앱이 알림을 쓰는 경우
    scope_template: {}
    rationale: 알림이 도착한 시각 — 그 앱이 그때 살아 있었다는 근거 (Notification.ArrivalTime)

# 06단계만 읽는다. 03단계는 이것을 수집하지 않는다.
#
# **이 프로젝트에서 corroborates 를 쓰는 첫 매핑이다.** 규칙대로 실측
# 기각을 보고 넣었다(docs/mapping-guide.md — "넓히는 것은 기각 기록을 보고").
#
# 근거: 2026-09-07 `K-TEST-518-VERIFY`. 05단계가 Defender 의 탐지·격리
# 기록을 정확히 골라 왔는데 06이 technique_unsupported 로 기각했다.
#
#     EID 1116  09-03 02:35:03  Trojan:Win32/PossibleMalware.A  탐지
#     EID 1117  09-03 02:35:18  Trojan:Win32/PossibleMalware.A  격리
#
# 격리 시각이 같은 파일의 $UsnJrnl `deleted`(02:35:18)와 초 단위로 맞는다.
# **정탐 기각이다** — 안티바이러스가 그 파일을 악성으로 판정한 기록은
# "사용자가 악성 파일을 실행했다"의 근거가 맞다.
#
# **artifacts 로 올리지 않는 이유.** 저쪽은 03단계가 "어디를 수집할까"로
# 읽는 축이라 넓히면 04 파싱 시간과 05 토큰 예산이 커진다. Defender 로그는
# 실행 흔적을 **찾는** 자리가 아니라 이미 찾은 것을 **뒷받침하는** 자리다.
corroborates:
  - evtx:Defender
