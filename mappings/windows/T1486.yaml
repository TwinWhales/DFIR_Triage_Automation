technique: T1486
name: "Data Encrypted for Impact"
os: windows

# 파일을 암호화해 못 쓰게 만든다. K-001 은 유출이 목적이라 이 국면이 없지만,
# 같은 침투 경로에서 다음으로 갈 수 있는 자리다.
#
# **가장 확실한 신호는 파일시스템에 있다.** 짧은 시간에 수천 개가 덮어쓰이고
# 이름이 바뀐다 — 그 모양은 명령행에 안 남는다. 그래서 Tier 1 이 $UsnJrnl 다.
#
# 실측(K2L5 세 노드, 2026-09-10): 암호화 관련 명령행 **0건**. 이 매핑은 이
# 사건이 아니라 다음 사건을 위한 것이고, 실물로 대조한 적이 없다는 사실을
# 여기 적어 둔다 — docs/limitations.md 의 미검증 축과 같은 성격이다.
artifacts:
  - name: $UsnJrnl
    tier: 1
    priority: 1
    rationale: 짧은 시간에 몰린 덮어쓰기·이름 변경 — 암호화의 모양은 명령행이 아니라 여기 남는다

  - name: $MFT
    tier: 1
    priority: 2
    rationale: 몸값 안내문의 생성과 확장자가 바뀐 파일들

  - name: evtx:Sysmon
    tier: 1
    priority: 3
    scope_template:
      event_ids: [1, 11]
    rationale: 암호화 도구의 실행과 명령행이 EID1, 안내문 생성이 EID11
