technique: T1200
name: "Hardware Additions"
os: windows

artifacts:
  # 20001(UserPnp: 드라이버 설치 완료)·10000(Kernel-PnP: 장치 구성)은
  # 공개 DFIR 자료 기준 추정치이며, 이 프로젝트의 실제 증거 이미지로는
  # 아직 대조하지 않았다 — docs/limitations.md 참고. "임의로 채운" 초안.
  #
  # 10000 은 채널을 가려야 한다. 같은 번호를 NetworkProfile 이
  # "네트워크 연결"로 쓰기 때문이다 — EventID 는 제공자 안에서만
  # 유일하고, 03단계의 event_ids 선별은 제공자를 구분하지 않는다.
  # 그래서 여기서는 아티팩트를 나눠 적는다.
  - name: evtx:System
    tier: 1
    priority: 2
    scope_template:
      event_ids: [20001, 10000]
    rationale: 신규 장치 드라이버 설치·장치 구성 이벤트(PnP)

  # 이동식 매체가 네트워크 어댑터를 물고 들어오는 경우(USB 이더넷·테더링)
  # 여기에 새 프로필이 남는다. 장치 추가와 네트워크 변화가 같은 시각에
  # 겹치는지가 판단 근거다.
  - name: evtx:NetworkProfile
    tier: 2
    priority: 2
    trigger: Tier1에서 신규 장치가 확인되어 그 장치가 네트워크를 끌어왔는지 확인해야 하는 경우
    rationale: 장치 추가 시각 전후의 네트워크 연결·해제(10000/10001)

  - name: registry:SYSTEM
    tier: 1
    priority: 1
    scope_template:
      path_prefix:
        - 'SYSTEM\CurrentControlSet\Enum\USB'
        - 'SYSTEM\CurrentControlSet\Enum\USBSTOR'
        - 'SYSTEM\MountedDevices'
    rationale: 신규 USB 장치 열거 정보(VID/PID, 시리얼)와 드라이브 문자 매핑

  # 장치 연결 시각의 1차 근거. evtx:System 의 20001/10000 은 제공자를
  # 구분하지 않는 선별이라 다른 장치 이벤트가 섞이는데, 이 두 채널은
  # 장치 전용이라 그 위험이 없다.
  #
  # 둘을 다 거는 이유는 어느 쪽에 남을지가 장치와 드라이버 상태에 따라
  # 갈리기 때문이다 — DriverFrameworks 는 연결/해제를, Kernel-PnP 는
  # 장치 설치를 남긴다.
  - name: evtx:DriverFrameworks
    tier: 1
    priority: 1
    scope_template:
      event_ids: [2003, 2004, 2005, 2006, 2010, 2100, 2101, 2102, 2105, 2106]
    rationale: 외부 장치의 연결·해제 시각

  - name: evtx:KernelPnP
    tier: 1
    priority: 1
    scope_template:
      event_ids: [400, 410, 411, 420, 430]
    rationale: 장치 드라이버 설치 시각

  # 사용자별 장치 이력(MountPoints2)은 NTUSER.DAT 에 있고 카탈로그에
  # 없다 — docs/limitations.md "SAM·SECURITY·NTUSER를 읽지 않는다".
  - name: registry:SOFTWARE
    tier: 2
    priority: 2
    trigger: Tier1에서 신규 장치가 확인되어 장치명·연결 시각을 보강해야 하는 경우
    rationale: Portable Devices 에 등록된 장치명과 연결 시각
