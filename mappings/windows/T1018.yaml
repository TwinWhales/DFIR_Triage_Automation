technique: T1018
name: "Remote System Discovery"
os: windows

# K-001 착지 직후 정찰 — ping으로 POS(.12)·관리서버(.13) 존재 확인.
# T1016 ipconfig와 함께 이동 전 대상 식별 클러스터.
artifacts:
  - name: evtx:Sysmon
    tier: 1
    priority: 1
    scope_template:
      event_ids: [1, 3]
    rationale: ping.exe 실행(EID1) + ICMP 발신(EID3) — POS·관리서버 존재 확인. 이동 전 대상 식별 행위

  - name: prefetch
    tier: 2
    priority: 2
    trigger: Tier1에서 ping 실행이 확인되어 실행 이력을 확인해야 하는 경우
    scope_template: {}
    rationale: ping.exe 실행 횟수·최근 실행 시각