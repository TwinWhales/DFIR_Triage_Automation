technique: T1078
name: "Valid Accounts"
os: windows

# K-001 Stage 4 — 영업시간 외 또는 정규 절차와 다른 관리자 인증.
#
# **상위 기법이다.** T1078.003(Local Accounts)이 따로 있고 둘은 이 도구에서
# 남남이다. 설계서 Stage 4 가 상위를 쓰므로 둘 다 둔다.
#
# "비정상"의 판정은 baseline 과의 비교이고 이 도구가 하지 않는다. 여기서
# 하는 일은 로그온 사건을 시간과 함께 꺼내 오는 것까지다.
artifacts:
  # **훔친 계정을 애플리케이션에 쓰는 순간.** 윈도우 로그온(Security 4624)과
  # 다른 축이다 — DB 계정으로 붙은 것은 SQL Server 자신의 로그에만 남는다.
  #
  # 실측(K2L6-MGMT, 2026-09-10): `mgmt_app` 계정의 로그인이 426건 중
  # 220건이고, 그중 **공격 시간대(09-08 07:00 이후)가 34건**이다. 시나리오
  # 에서 공격자가 설정 파일에서 훔친 바로 그 계정이다.
  #
  # 채널 자체는 `_baseline.yaml` 이 무조건 연다(02가 이 기법을 고른 적이
  # 없어서다). 여기 적는 것은 **06단계가 이 증거로 이 기법을 인정하게**
  # 하기 위해서다 — 매핑에 없으면 옳게 붙여도 technique_unsupported 다.
  - name: evtx:Application
    tier: 1
    priority: 2
    scope_template:
      event_ids: [18453, 18454, 18456]
    rationale: 애플리케이션·DB 로그인 성공과 실패 — 어느 계정이 언제 붙었는지

  - name: evtx:Security
    tier: 1
    priority: 1
    scope_template:
      event_ids: [4624, 4625, 4634, 4647, 4672, 4738]
    rationale: 로그온·로그오프 시각과 계정·로그온 타입, 특수권한 부여

  - name: evtx:RDPConnection
    tier: 2
    priority: 2
    trigger: Tier1에서 로그온 타입 10(RemoteInteractive)이 확인된 경우
    rationale: 원격 연결의 출처와 인증 시각

  # SAM 하이브는 카탈로그에 없다. 신규 RID·마지막 로그온·그룹 멤버십이
  # 거기 있는데 지금 읽지 못한다 — docs/limitations.md 2-8.
