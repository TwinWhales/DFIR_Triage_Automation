technique: T1041
name: "Exfiltration Over C2 Channel"
os: windows

# K-001 Stage 7 — 스테이징한 데이터를 외부 Mock 서버로 전송.
#
# 설계서의 탐지 포인트는 "송신 프로세스가 Stage 2~6의 비정상 프로세스와
# 동일한가"이고, 그 판단은 여러 레코드를 겹쳐야 나온다. 여기서는 판단의
# 재료를 모으는 것까지 한다.
#
# **수신 측 확증(Mock 서버 access 로그)은 이 도구 밖이다.** 양방향 확증의
# 한쪽만 볼 수 있고, 그 한계는 보고서의 분석 범위에 남는다.
artifacts:
  - name: evtx:Sysmon
    tier: 1
    priority: 1
    scope_template:
      event_ids: [3, 22]
    rationale: 송신 프로세스와 목적지 IP·포트·도메인

  - name: evtx:Firewall
    tier: 1
    priority: 2
    scope_template: {}
    rationale: 아웃바운드 연결의 허용·차단 기록

  - name: evtx:NetworkProfile
    tier: 2
    trigger: Tier1에서 외부 통신이 확인되어 그 시각의 네트워크 연결 상태를 확인해야 하는 경우
    rationale: 전송 시각 전후의 네트워크 연결·해제
