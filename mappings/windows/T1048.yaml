technique: T1048
name: "Exfiltration Over Alternative Protocol"
os: windows

# K-001 Stage 7 보조 — C2 가 아닌 경로로 나가는 경우.
#
# T1041 과 보는 아티팩트가 같다. 나뉘는 것은 **목적지와 프로토콜의 해석**
# 이고 그것은 모델의 몫이다. 매핑을 합치지 않는 이유는 02단계가 어느
# 쪽을 내든 선별이 되어야 하기 때문이다.
artifacts:
  - name: evtx:Sysmon
    tier: 1
    priority: 1
    scope_template:
      event_ids: [3, 22]
    rationale: 송신 프로세스와 목적지·프로토콜

  # evtx:Firewall 은 걸지 않는다 (2026-08-25 에 뺐다).
  #
  # 한때 "아웃바운드 연결의 허용·차단 기록"이라는 rationale 로 Tier 1 에
  # 걸려 있었는데 **그 채널에는 그런 기록이 없다.** Windows Firewall With
  # Advanced Security/Firewall 이 담는 것은 방화벽 규칙·프로필의 구성
  # 변경이다(그쪽은 T1562.004 가 본다).
  #
  # 연결 단위 허용/차단 감사는 Security 의 5152·5156·5157(필터링 플랫폼)에
  # 있다. 걸지 않는 이유는 둘이다 — 기본 감사가 꺼져 있어 대개 안 남고,
  # 켜면 정상 트래픽으로 로그가 가득 차 05단계 쿼터를 혼자 태운다.
  #
  # 외부 통신의 근거는 Sysmon 3·22 가 Tier 1 로 들고 있다.

  # SRUM 네트워크 사용량. **Sysmon 이 없는 호스트에서 유일한 근거가 된다** —
  # 2026-08-26 K-ALERT 실측 이미지가 정확히 그 상황이었다(Sysmon 미설치).
  #
  # Sysmon 3 과 보는 것이 다르다. 저쪽은 "연결이 있었다"이고 이쪽은
  # **"얼마나 나갔다"** 이다. 유출의 규모는 SRUM 에만 있다.
  #
  # 대가를 알고 건다 — 시간 해상도가 시간 단위 집계라 개별 전송을 못
  # 가른다. 목적지 IP 도 없다. 그 둘은 Sysmon 3 이 들고 있다.
  - name: srum:NetworkUsage
    tier: 1
    priority: 2
    rationale: 앱별 송신·수신 바이트와 시각. 유출의 규모

  - name: evtx:BITS
    tier: 2
    trigger: Tier1에서 외부 통신이 확인되었으나 송신 프로세스를 특정하지 못한 경우
    rationale: BITS 를 경유한 백그라운드 전송의 URL 과 완료 시각
