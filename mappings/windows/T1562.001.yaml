technique: T1562.001
name: "Impair Defenses: Disable or Modify Tools"
os: windows

artifacts:
  # 명령행으로 끄는 것이 이 기법의 요즘 모습이다. 아래 셋은 전부 그 뒤에
  # 남는 상태(레지스트리 값·서비스 시작 유형·Defender 자기 로그)를 보는데,
  # **끄는 행위 자체는 명령행에만 있다.**
  #
  # 실측(K2L5-KIOSK, 2026-09-10): 4건.
  #   SYSMON#22246  powershell -Command ... Set-MpPreference -DisableRealtimeMonitoring
  #   SYSMON#22249  reg add HKLM Software Policies Microsoft Windows Defender ...
  #   SYSMON#22291  reg add ... Services WinDefend /v Start ...
  #
  # 이 채널이 없어서 05단계가 그 레코드에 T1562.001 을 붙이면 06단계가
  # technique_unsupported 로 기각할 자리였다. 실제로 모델은 T1041 을 붙였다.
  - name: evtx:Sysmon
    tier: 1
    scope_template:
      event_ids: [1]
    rationale: 보안 도구를 끄는 명령행 — Set-MpPreference·서비스 Start 변경·정책 값 기록

  # 서비스 Start 값이 4(disabled)로 바뀌었는지가 핵심이다. 값 자체는
  # SYSTEM 하이브에 남고, 바뀐 시점은 evtx 7040에 남는다. 둘을 같이
  # 봐야 "언제 누가"가 나온다.
  - name: registry:SYSTEM
    tier: 1
    scope_template:
      path_prefix:
        - 'SYSTEM\CurrentControlSet\Services\WinDefend'
        - 'SYSTEM\CurrentControlSet\Services\WdNisSvc'
        - 'SYSTEM\CurrentControlSet\Services\Sense'
        - 'SYSTEM\CurrentControlSet\Services\wscsvc'
        - 'SYSTEM\CurrentControlSet\Services\EventLog'
    rationale: 보안 관련 서비스의 시작 유형(Start) 변경 여부

  - name: registry:SOFTWARE
    tier: 1
    scope_template:
      path_prefix:
        - 'SOFTWARE\Policies\Microsoft\Windows Defender'
        - 'SOFTWARE\Microsoft\Windows Defender'
    rationale: 실시간 보호·감시 기능 비활성화 정책 값

  - name: evtx:System
    tier: 1
    scope_template:
      event_ids: [7040, 7045]
    rationale: 서비스 시작 유형 변경(7040) 및 신규 서비스 설치(7045) 시점

  # 카탈로그(_artifacts.yaml)가 이 채널을 "T1562.001 매핑이 참조한다"고
  # 적어 두었는데 실제로는 아무 매핑도 요청하지 않고 있었다(2026-08-31).
  # 파서만 달리고 아무도 안 쓰는 채널이 되므로 여기에 잇는다.
  #
  # **event_id 를 실물로 확인하지 못했다.** 손에 있는 이미지에 이 채널이
  # 없어 카탈로그 설명의 값을 그대로 옮겼다 — docs/limitations.md.
  - name: evtx:Defender
    tier: 1
    scope_template:
      event_ids: [5001, 5004, 5007]
    rationale: 실시간 보호 비활성(5001)·보호 비활성화 알림(5004)·구성 변경(5007) — 무력화 당사자의 로그

  - name: $MFT
    tier: 2
    trigger: Tier1에서 보안 서비스 비활성화가 확인되어 사용된 도구를 특정해야 하는 경우
    rationale: 비활성화 시각 전후에 생성된 실행 파일
