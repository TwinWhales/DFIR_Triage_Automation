technique: T1070.004
name: "Indicator Removal: File Deletion"
os: windows

artifacts:
  # 경로를 좁히지 않는다. 어디를 지웠는지 모르는 상태에서 찾는 것이
  # 이 기법의 성격이다. 판정은 flags(deleted)가 하고, 선별은 시간
  # 범위로만 좁힌다. T1070.006(Timestomp)과 같은 구조다.
  - name: $MFT
    tier: 1
    scope_template: {}
    rationale: 삭제된 파일의 미할당 레코드

  - name: $UsnJrnl
    tier: 2
    trigger: Tier1 $MFT에서 deleted 플래그 발견 시
    rationale: 삭제 시각과 삭제 전 파일명 이력

  # 이 기법에서 프리패치가 강한 이유는 **지운 뒤에도 남기 때문**이다.
  # 실행 파일을 지우면 $MFT 레코드는 미할당이 되고 내용은 덮이지만,
  # 프리패치는 별도 파일이라 그대로 있고 전체 경로·실행 횟수·최근 실행
  # 시각을 들고 있다. "지워진 무언가가 실행됐다"를 말할 수 있는 거의
  # 유일한 아티팩트다.
  #
  # $MFT 와 같이 경로를 좁히지 않는다. 어디를 지웠는지 모르는 상태에서
  # 찾는 것이 이 기법의 성격이다.
  - name: prefetch
    tier: 1
    scope_template: {}
    rationale: 삭제된 실행 파일의 실행 흔적 (경로·횟수·최근 실행 시각)
