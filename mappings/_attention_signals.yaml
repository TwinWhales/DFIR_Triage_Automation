version: 1

# One ordered vocabulary drives both long-list preservation and attention.
# Entries describe observed strings only; they do not classify maliciousness.
#
# 대표 레코드 선택도 여기서 선언한다. 파이썬에 실행 파일 이름을 적으면 그
# 표본에서만 맞는 값이 코드에 남는다 — 실제로 그렇게 됐었다(`z7hriire.exe`는
# SVCStealer 가 그 실행에서 만든 무작위 이름이라 다른 증거엔 존재하지 않는다).
prompt_keep_path_groups:
  # keep 목록도 상한을 받는다. 안 받으면 적중이 많은 레코드가 자리를
  # 통째로 먹어 목록 앞머리가 사라진다 — 실행 파일 자신이 대개 첫
  # 항목이라 그 자리는 남겨야 한다.
  #
  # **12 는 실측에서 고른 값이다**(win10_sysmon_testimage, 적재 경로
  # 10,109건 / 레코드 127건, 2026-08-27):
  #
  #   아래 어휘 적중       992건 (9.81%)   적중 레코드 47/127, 중앙값 5
  #   상한 12 를 넘는 레코드  16건
  #   상한 20 을 넘는 레코드  11건
  #
  # 20(= MAX_LIST_ITEMS) 중 12 를 주면 앞머리 몫 8자리가 남는다. 적중이
  # 0인 레코드 80건은 지금까지와 똑같이 앞에서부터 20개다.
  max_items: 12

  # 부분 문자열로 본다. 앞뒤 역슬래시는 부분 일치가 헐거워서 붙였다 —
  # `\users\` 가 아니라 `users` 로 쓰면 `C:\Program Files\UsersHelper\`
  # 가 걸린다(execution_from_unusual_path 와 같은 이유).
  #
  # **부정으로 쓰지 않는다.** "Windows 폴더 밖" 이 사이드로딩 신호로는
  # 더 강하지만, 04단계의 장치 경로 변환이 실패하면 부정 조건은 전량을
  # 잡아 keep 목록이 조용히 무의미해진다. 열거하면 그때 0건이 되고,
  # 0건은 stats["loaded_paths_converted"] 로 드러난다.
  #
  # 그룹의 선언 순서가 보존 우선순위이고, 그룹 안 `contains` 의 선언 순서가
  # 대표 레코드 선택의 우선순위다.
  groups:
    credential_stores:
      attack: T1555
      signal: sensitive_credential_store_referenced
      must_review: true
      # 같은 어휘가 여러 레코드에 걸릴 때 어느 것을 대표로 볼 것인가.
      # 선언 순서가 우선순위이며, 목록에 없는 실행 파일은 전부 동순위다.
      representative_images: ['msedge.exe']
      contains:
        - '\login data'
        - '\logins.json'
        - '\key4.db'
        - '\cookies'
        - '\cookies.sqlite'
        - '\recentservers.xml'
        - '\winscp.ini'
    investigation_paths:
      must_review: false
      contains:
        - '\appdata\local\temp\'
        - '\appdata\roaming\'
        - '\windows\temp\'
        - '\users\'
        - '\$recycle.bin\'
        - '\perflogs\'
        - '\programdata\'
        - '\downloads\'

attention_signals:
  # 04단계가 명령행 관용구로 판정한 고위험 행위군은 종류별 대표 한 건을
  # 반드시 검토한다. 이것은 악성 판정이 아니라 모델이 해당 관측을 보고
  # 선택/기각 이유를 남기게 하는 보장 레인이다.
  lolbin_download_observed:
    must_review: true
    flags: [lolbin_download]
    match_fields: [fields.Image, fields.CommandLine]
    representative_images: [certutil.exe]
  security_tool_config_change_observed:
    must_review: true
    flags: [security_tool_config_changed]
    match_fields: [fields.Image, fields.CommandLine]
  persistence_command_observed:
    must_review: true
    flags: [persistence_command]
    match_fields: [fields.Image, fields.CommandLine]
    representative_images: [schtasks.exe]
  uac_bypass_candidate_observed:
    must_review: true
    flags: [uac_bypass_candidate]
    match_fields: [fields.Image, fields.CommandLine]
    representative_images: [fodhelper.exe]
  discovery_command_observed:
    must_review: true
    flags: [discovery_command]
    match_fields: [fields.Image, fields.CommandLine]
    representative_images: [whoami.exe]
  # **이름이 아니라 자리로 고른 신호.** 04단계의 execution_from_unusual_path
  # 는 "공격자가 무엇을 실행할지는 몰라도 어디에 놓을 수 있는지는 안다"는
  # 판단이라(`mappings/_flags.yaml`), 도구 이름을 모르는 조사에서 가장
  # 쓸모가 크다. 그런데 보장 레인에는 올라오지 않고 있었다.
  #
  # 실측(`K-2LINE-KIOSK`, 2026-09-09): 두 줄짜리 질문으로 돌린 실행에서
  # `C:\Temp\nmap\Nmap\nmap.exe` 가 04에 있었는데 05에 한 건도 전달되지
  # 않았다. 시나리오가 도구 이름을 대지 않았고(그것이 정상이다) 플래그만
  # 붙은 레코드는 5,669건 중 66자리를 두고 밀렸다.
  #
  # representative_images 를 비워 둔 것은 의도다 — 여기서 이름을 적으면
  # 이 신호의 요지("이름을 모르는 채로 자리로 고른다")를 스스로 어긴다.
  #
  # **상한이 5인 이유.** 다른 신호는 이름으로 고른다 — certutil 이 여러 번
  # 나와도 하나만 보면 뜻이 통한다. 이 신호는 **자리로** 고르므로 그 자리에
  # 무엇이 있는지 우리가 모르고, 하나만 보내면 배경이 뽑힐 수 있다.
  # 실측(`K-2LINE-FIX`): 19건 중 앵커 기준 1·2등이 설치 관리자의 임시
  # 폴더였고 공격자의 `C:\Temp\nmap` 은 3등이었다. 개체 수가 적어(노드당
  # 19건) 5자리는 60자리 예산에서 감당된다.
  execution_from_unusual_path_observed:
    must_review: true
    flags: [execution_from_unusual_path]
    match_fields: [fields.Image]
    max_representatives: 5
  # **자격증명 척추 셋.** K2L3 실측에서 시나리오의 Stage 1(리버스 셸)·
  # Stage 3(POS 착지)·Stage 6(RDP 진입)·Stage 7(DB 자격증명 열람)이 보고서에
  # 한 줄도 없었는데, 레코드는 넷 다 04단계에 있었다. 04 가 붙이는 flag 가
  # 너무 넓어(`logon_success` 2,945건 · `network_connection` 362건) 배분에서
  # 밀린 것이라, 좁은 flag 를 새로 만들고 그 자리를 여기서 보장한다.
  #
  # 상한이 셋 다 3인 이유가 다르다 —
  #   remote_interactive_logon      전량이 6건이고 2건씩 짝을 이룬다(세 세션).
  #   credential_config_accessed    11건 중 10건이 랩 제작자의 5일 전 작업이라,
  #                                 앵커 거리 정렬이 공격 건을 앞으로 보낸다.
  #   suspicious_c2_port_connection 전량이 3건(키오스크 2 · POS 1)이다.
  remote_interactive_logon_observed:
    must_review: true
    flags: [remote_interactive_logon]
    match_fields: [fields.TargetUserName, fields.IpAddress, fields.LogonType]
    max_representatives: 3

  credential_config_accessed_observed:
    must_review: true
    flags: [credential_config_accessed]
    match_fields: [fields.Image, fields.CommandLine]
    max_representatives: 3

  # **representative_images 를 비워 둔다.** 리버스 셸을 받는 프로세스 이름은
  # 공격자가 고르는 것이라(이 증거에서도 powershell.exe 와 spoolsv.exe 로
  # 서로 다르다) 여기 적으면 그 표본에서만 맞는 값이 된다.
  suspicious_c2_port_connection_observed:
    must_review: true
    flags: [suspicious_c2_port_connection]
    match_fields: [fields.Image, fields.DestinationIp, fields.DestinationPort]
    max_representatives: 3

  # **이 사건의 목적이 여기 있었다.** K2L-20260908 에서 결제 정산 테이블을
  # CSV 로 빼는 행위(SQLCMD ... SELECT * FROM ...settlements -o C:\exfil\...)
  # 에 flag 가 없어 05단계 배분에서 밀렸고, 관리서버 보고서는 수집 도구와
  # VMware 스크립트만 실었다. flag 를 만드는 것만으로는 부족하다 — 보장
  # 레인에 올려야 모델이 그 레코드를 반드시 처분한다.
  #
  # 상한이 3인 이유는 **반복이 곧 사실이기 때문**이다. 이 덤프는 10분마다
  # 도는 예약 작업이 돌려 18건이 거의 같은 명령행이다. 하나만 보내면
  # "한 번 조회했다"로 읽히고, 전부 보내면 자리를 먹는다. 셋이면 간격이
  # 보인다.
  database_dump_observed:
    must_review: true
    flags: [database_table_dumped]
    match_fields: [fields.Image, fields.CommandLine]
    max_representatives: 3

  # execution_from_unusual_path_observed 와 같은 취지의 짝이다 — 저쪽은
  # 아는 자리를 열거해 보고 이쪽은 **최상위 폴더를 누가 만들었나**를 본다.
  # 이름을 적지 않는다는 요지가 같으므로 representative_images 도 비운다.
  #
  # 상한 5도 같은 근거다(그쪽 주석 참조). 실측 55건 중 30건이 볼륨 루트에
  # 설치된 SQL Server 라, 하나만 보내면 그쪽이 뽑힐 수 있다.
  execution_outside_known_volume_root_observed:
    must_review: true
    flags: [execution_outside_known_volume_root]
    match_fields: [fields.Image]
    max_representatives: 5

  # **DB 에 누가 붙었나.** 시나리오의 Stage 8 이고, 이 사건에서 결제 데이터를
  # 꺼내 간 계정의 로그인이 여기 있다. 04단계의 database_logon 이 붙인다.
  #
  # 상한이 3인 이유: MGMT 에 426건이 있는데 대부분이 애플리케이션 자신의
  # 주기적 접속이다(1분 간격). 하나만 보내면 그 주기 중 하나가 뽑히고,
  # 셋이면 실패(18456)나 시간대가 다른 것이 섞일 자리가 생긴다.
  database_logon_observed:
    must_review: true
    flags: [database_logon]
    match_fields: [fields.event_data, fields.Data]
    max_representatives: 3

  credential_export_option_observed:
    must_review: true
    all_contains: [netsh, wlan, key=clear]
    representative_images: ['netsh.exe', 'cmd.exe']
  browser_sandbox_disabled:
    must_review: true
    all_contains: ['--no-sandbox']
  silent_install_option_observed:
    must_review: true
    any_contains: ['/verysilent', '/silent']
  epoch_timestamp_observed:
    must_review: true
    # **어느 값을 보는지 반드시 좁힌다.** 좁히지 않으면 레코드의 모든 문자열이
    # 대상이 되어 `C:\photos\1970-summer.jpg` 같은 정상 경로가 보장 레인
    # 한 자리를 먹는다 (2026-09-08 실측 확인).
    match_fields: [timestamp]
    any_contains: ['1970-']
