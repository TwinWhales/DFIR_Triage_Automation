# 아티팩트 카탈로그 — 이 도구가 아는 아티팩트의 전부.
#
# 여기 없는 아티팩트는 선별될 수도, 제외될 수도 없다. 즉 보고서의
# "분석 범위 한계"에도 나타나지 않는다. 새 아티팩트를 지원하려면
# 파서보다 이 파일을 먼저 고친다.
#
# supported: false 인 항목은 항상 excluded로 전달된다. 보지 않기로 한
# 것과 그 이유를 남기는 것이 이 설계의 핵심이므로, 아무도 요청하지
# 않았더라도 목록에서 빼지 않는다.
#
# 뒤집어 말하면 **여기 넣는 순간 모든 보고서에 실립니다.** 그래서 아직
# 착수하지 않은 아티팩트는 넣지 않는다. 레지스트리는 예전에 그 상태였다 —
# ref 접두어와 스키마만 미리 열어 두고 여기서는 빠져 있었다. 파서가
# 생기면서 아래에 추가했다.
#
# 카탈로그와 파서 등록소가 어긋나면 tests/test_pipeline_e2e.py 가 잡는다.
# supported: true 인데 파서가 없거나, 파서가 있는데 여기 없거나 둘 다.

mapping_table_version: "1.1"

artifacts:
  $MFT:
    parser: mft
    os: [windows]
    supported: true
    description: NTFS 마스터 파일 테이블. 파일 생성·삭제·타임스탬프.

  $UsnJrnl:
    parser: usnjrnl
    os: [windows]
    supported: true
    description: USN 저널. 파일 변경 이력.

  evtx:Security:
    parser: evtx
    os: [windows]
    supported: true
    description: 보안 이벤트 로그. 계정·로그온·권한.

  evtx:System:
    parser: evtx
    os: [windows]
    supported: true
    description: 시스템 이벤트 로그. 서비스·드라이버.

  # 아래 셋은 evtx 파서를 그대로 재사용한다 — 채널만 다르고 온디스크
  # 형식이 같다. Security/System 만 보던 동안 네트워크 쪽 흔적은 카탈로그에
  # 없어서 "확인하지 못한 아티팩트"에도 나타나지 않았다(2026-08-24 실측,
  # docs/limitations.md "네트워크 흔적을 볼 수 없다").
  #
  # 셋 다 로그가 작다(실측 394·118·30건). Security 처럼 event_ids 로
  # 좁히지 않아도 쿼터를 잡아먹지 않으므로 signal_source 는 기본값(flags)을
  # 쓴다 — 붙일 플래그가 실제로 있다(_flags.yaml).
  evtx:Firewall:
    parser: evtx
    os: [windows]
    supported: true
    description: Windows 방화벽(WFP) 로그. 규칙 추가·변경·삭제와 프로필 설정 변경.

  evtx:BITS:
    parser: evtx
    os: [windows]
    supported: true
    description: BITS 클라이언트 로그. 백그라운드 전송 작업의 생성·URL·완료.

  evtx:NetworkProfile:
    parser: evtx
    os: [windows]
    supported: true
    description: 네트워크 프로필 로그. 네트워크 연결·해제 시점.

  # ── K-001 키오스크 시나리오가 요구하는 채널 (2026-08-25) ────────────
  #
  # 아홉 다 evtx 파서를 그대로 재사용한다. 채널만 다르고 온디스크 형식이
  # 같아서 새 파서가 필요 없다 — Firewall/BITS/NetworkProfile 을 넣을 때와
  # 같은 자리다.
  #
  # **여기 넣는 순간 모든 보고서의 "분석 범위 한계"에 실린다.** 아홉이나
  # 늘리는 것은 그만한 이유가 있어서다 — 시나리오 설계서(K-001)가 Stage
  # 1·3·4b·6·7 의 Tier 1 근거로 이 채널들을 지목하고 있고, 없으면 그
  # 단계들이 통째로 "확인 못 함"으로 나간다.

  # Sysmon 은 이 카탈로그에서 유일하게 **기본 탑재가 아닌** 로그다. 랩에
  # 설치돼 있어야 하고, 없으면 artifact_not_found 로 빠진다 — 그것이 맞다.
  #
  # signal_source 를 flags 로 둔 이유: Operational 채널은 이 장비에서 가장
  # 큰 로그가 되기 쉽다(EID 1 이 수만 건). 전량을 후보로 올리면 05단계
  # 쿼터를 혼자 태운다. shell_spawned·network_connection 이 실제로 좁힌다.
  evtx:Sysmon:
    parser: evtx
    os: [windows]
    supported: true
    signal_source: flags
    description: Sysmon Operational. 프로세스 생성(1)·네트워크 연결(3)·DNS 질의(22).

  # Stage 1 — 외부 장치 연결/해제 시각. device_connected 가 붙는다.
  evtx:DriverFrameworks:
    parser: evtx
    os: [windows]
    supported: true
    signal_source: flags
    description: 사용자 모드 드라이버 프레임워크 로그. 외부 장치 연결·해제 시각.

  # Stage 1 — 장치 설치 시각. DriverFrameworks 와 같은 플래그를 쓴다.
  evtx:KernelPnP:
    parser: evtx
    os: [windows]
    supported: true
    signal_source: flags
    description: 커널 PnP 구성 로그. 장치 설치 시각.

  # Stage 3 — 키오스크 제한 환경. 셋 다 로그가 작아 event_ids 로 좁히지
  # 않고 전 레코드에 kiosk_restriction_event 를 붙인다. 이 채널에 남는
  # 것 자체가 키오스크 구성·이탈과 관련된 사건이다.
  evtx:AssignedAccess:
    parser: evtx
    os: [windows]
    supported: true
    signal_source: flags
    description: Assigned Access(키오스크 모드) 운영 로그. 제한 환경의 동작.

  evtx:AssignedAccessAdmin:
    parser: evtx
    os: [windows]
    supported: true
    signal_source: flags
    description: Assigned Access 관리 로그. 키오스크 구성 오류·적용 실패.

  evtx:AssignedAccessBroker:
    parser: evtx
    os: [windows]
    supported: true
    signal_source: flags
    description: Assigned Access 브로커 로그. 키오스크 세션 생성·종료.

  # Stage 4b — 원격 세션. 둘 다 remote_session 이 붙는다.
  evtx:RDPConnection:
    parser: evtx
    os: [windows]
    supported: true
    signal_source: flags
    description: 원격 데스크톱 연결 관리자 로그. 원격 연결 인증(1149).

  evtx:RDPSession:
    parser: evtx
    os: [windows]
    supported: true
    signal_source: flags
    description: 원격 데스크톱 로컬 세션 관리자 로그. 세션 로그온·셸 시작·재연결(21·22·24·25).

  # Stage 3 보조 — 키오스크 앱의 비정상 종료. 실측 8,257건짜리 큰 로그라
  # 전 레코드에 붙이면 필터가 일을 안 한다. app_crash 가 오류 이벤트만 잡는다.
  evtx:Application:
    parser: evtx
    os: [windows]
    supported: true
    signal_source: flags
    description: 애플리케이션 이벤트 로그. 앱 오류(1000)·WER 보고(1001).

  # 레지스트리는 다른 아티팩트와 선별 방식이 다르다. 다른 것들은 전부
  # 훑고 flags 로 추리지만, 레지스트리는 가치가 레코드가 아니라 경로에
  # 있어 scope_template 의 path_prefix 가 사실상 전부를 정한다.
  # path_prefix 없이 요청하면 SOFTWARE 하이브가 156,716건을 낸다.
  #
  # CurrentControlSet 은 그대로 써도 된다. 파서가 Select\Current 를
  # 읽어 ControlSet00N 으로 바꾼다 — 매핑 작성자가 하이브 내부 사정을
  # 몰라도 되게 한 것이다.
  #
  # signal_source: scope 인 이유가 여기 있다. 다른 아티팩트는 04단계가
  # 전부 훑고 재미있는 것에 플래그를 붙이지만, 레지스트리는 붙일 플래그가
  # 없다 — 위 문단대로 판정이 이미 path_prefix 에서 끝났기 때문이다.
  # 05단계가 이것을 모르면 플래그 없는 레코드를 전부 버려서 선별이 정확히
  # 골라 온 것이 한 건도 모델에 가지 않는다(limitations.md 6-7 실측).
  registry:SYSTEM:
    parser: registry
    os: [windows]
    supported: true
    signal_source: scope
    description: SYSTEM 하이브. 서비스·드라이버·장치 설정.

  registry:SOFTWARE:
    parser: registry
    os: [windows]
    supported: true
    signal_source: scope
    description: SOFTWARE 하이브. 설치 프로그램·자동실행·예약 작업 캐시.

  # Amcache.hve도 regf 포맷이라 registry 파서를 그대로 재사용한다.
  # SYSTEM/SOFTWARE와 같은 이유로 flags가 붙지 않으므로
  # signal_source 도 같다 — 빼먹으면 파싱은 되는데 05단계에서 통째로
  # 사라진다(docs/limitations.md 6-7).
  registry:Amcache:
    parser: registry
    os: [windows]
    supported: true
    signal_source: scope
    description: Amcache.hve. 실행/설치된 프로그램의 경로·SHA1·타임스탬프. Windows 8 이상.

  # Windows 7 에서 Amcache.hve 자리를 대신하는 아티팩트다. 같은 폴더에
  # 있지만 regf 가 아니라 자체 포맷이라 파서가 따로 있다.
  #
  # **둘은 배타적이다.** Win7 에는 Amcache 가 없고 Win8 부터는 이것이
  # 없다. 어느 쪽을 읽을지는 03단계가 정할 수 없다 — 증거를 열지 않아
  # 버전을 모르기 때문이다. 그래서 매핑은 둘 다 요청하고, 04단계가
  # 빌드 번호를 보고 해당 없는 쪽을 version_not_applicable 로 뺀다
  # (src/stage04_parse/osinfo.py).
  #
  # signal_source 는 레지스트리·프리패치와 같다. 목록의 모든 항목이
  # "실행된 적 있는 파일"이라 그 사실 자체는 변별력이 없고, 어느 경로인지가
  # 신호인데 그 판단은 선별(path_prefix)이 이미 했다.
  recentfilecache:
    parser: recentfilecache
    os: [windows]
    supported: true
    signal_source: scope
    description: RecentFileCache.bcf. 최근 처음 실행된 실행 파일의 전체 경로 목록. Windows 7 전용.

  # 유일한 디렉터리 아티팩트다. Windows/Prefetch 폴더 안의 .pf 전부가
  # 이 아티팩트 하나이며, 파일마다 레코드가 하나씩 나온다.
  #
  # 여기 supported: false 로 있던 시절의 exclude_reason 은 "본 버전 파싱
  # 모듈 미지원"이었다. 이제 파서가 있으므로 그 문장은 사실이 아니다.
  # 남은 사실 — Windows Server 는 기본 비활성화라 수집되지 않는 경우가
  # 많다 — 은 제외 사유가 아니라 **증거 없음**이고, 04단계가
  # artifact_not_found 로 기록해 보고서의 "분석 범위 한계"에 싣는다.
  # 레지스트리와 같은 자리다(limitations.md 6-8). "CMD.EXE가 5회 실행됐다"는
  # 그 자체로 신호가 아니고, shell.aspx 를 적재했다는 사실이 신호인데 그
  # 판단은 선별(path_prefix)이 이미 했다. program_executed 같은 플래그를
  # 새로 만드는 안은 접었다 — 모든 레코드에 붙으면 플래그가 "볼 만하다"는
  # 뜻이기를 그만둔다.
  prefetch:
    parser: prefetch
    os: [windows]
    supported: true
    signal_source: scope
    description: 프리패치. 실행 이력 — 실행 파일 경로·실행 횟수·최근 실행 시각·적재된 파일 목록.

  # ── HID/BadUSB 시나리오 추가 채널 (2026-08-31) ───────────────────────
  # evtx 파서 재사용. T1562.001·T1059.001 매핑이 참조한다.
  evtx:Defender:
    parser: evtx
    os: [windows]
    supported: true
    signal_source: flags
    description: Windows Defender 운영 로그. 실시간 보호 비활성(5001)·보호 비활성화 알림(5004)·구성 변경(5007).

  evtx:PowerShell:
    parser: evtx
    os: [windows]
    supported: true
    signal_source: flags
    description: PowerShell 운영 로그. 스크립트블록 로깅(4104)·모듈 로깅(4103).

  # ── 커스텀/미지원 아티팩트 ────────────────────────────────────────────
  # 파서 미구현. supported: false 로 범위 한계에 기록해 둔다.
  kiosk_app_config:
    parser: null
    os: [windows]
    supported: false
    exclude_reason: 커스텀 JSON 파서 미구현 — 추후 파서 구현 시 교체
    description: 키오스크 앱 설정 파일(C:\KioskApp\settings.json). 관리자 PIN·POS API 엔드포인트.

  cryptnet_urlcache:
    parser: null
    os: [windows]
    supported: false
    exclude_reason: 전용 파서 미구현
    description: CryptnetUrlCache. certutil -urlcache 다운로드 흔적. URL·바이트 캐시 사본.

  psreadline_history:
    parser: null
    os: [windows]
    supported: false
    exclude_reason: 전용 파서 미구현
    description: PSReadLine 콘솔 히스토리(ConsoleHost_history.txt). 대화형 PowerShell 세션 입력 이력.

  $LogFile:
    parser: null
    os: [windows]
    supported: false
    exclude_reason: 본 버전 미지원 (파싱 모듈 범위 외)
