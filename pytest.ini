[pytest]
# 리포지토리 루트를 sys.path에 넣어 `from src.common import ...` 가 되게 한다.
# 이게 없으면 pytest가 tests/ 를 sys.path에 넣어 src 패키지를 찾지 못한다.
pythonpath = .
testpaths = tests
addopts = -q

# 실제 LLM 을 부르는 테스트. DFIR_LIVE_MODEL 이 없으면 스스로 건너뛰므로
# 기본 실행에서는 아무 일도 하지 않는다. 등록해 두는 것은 이름 오타로
# 마커가 조용히 무시되는 것을 막기 위해서다.
markers =
    live: 실제 모델을 호출한다 (tests/test_llm_live.py, DFIR_LIVE_MODEL 필요)
